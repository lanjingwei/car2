<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D 汽车驾驶模拟器</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            font-family: 'SF Pro Display', 'Helvetica Neue', 'Microsoft YaHei', sans-serif;
        }
        canvas {
            display: block;
        }
        
        /* 高奢极简半透明设计 */
        .glass-panel {
            background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        
        /* 控制提示UI - 极简水平设计 */
        #ui {
            position: absolute;
            bottom: 30px;
            left: 30px;
            color: rgba(255,255,255,0.6);
            display: flex;
            gap: 8px;
            font-size: 12px;
            background: transparent;
            border: none;
            box-shadow: none;
            backdrop-filter: none;
            padding: 0;
        }
        .control-item {
            display: flex;
            align-items: center;
            gap: 4px;
            opacity: 0.6;
        }
        .key {
            font-size: 11px;
            font-weight: 400;
            opacity: 0.8;
        }
        .icon {
            font-size: 10px;
            opacity: 0.5;
        }
        
        /* 圆形速度仪表盘 */
        #speedometer {
            position: absolute;
            bottom: 30px;
            right: 30px;
            width: 200px;
            height: 200px;
            background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.02) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 50%;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }
        #speedometer svg {
            width: 100%;
            height: 100%;
        }
        .speed-text {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            text-align: center;
            color: rgba(255,255,255,0.9);
        }
        .speed-value {
            font-size: 28px;
            font-weight: 300;
            letter-spacing: -1px;
        }
        .speed-unit {
            font-size: 11px;
            letter-spacing: 2px;
            opacity: 0.7;
            margin-top: 2px;
        }
        
        /* 加载界面 */
        #loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(255,255,255,0.9);
            font-size: 18px;
            font-weight: 300;
            padding: 40px 60px;
            letter-spacing: 3px;
        }
        
        /* 启动按钮 */
        #startBtn {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            padding: 20px 50px;
            font-size: 16px;
            font-weight: 400;
            letter-spacing: 3px;
            color: rgba(255,255,255,0.9);
            background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, rgba(255,255,255,0.05) 100%);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255,255,255,0.2);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            z-index: 2000;
        }
        #startBtn:hover {
            background: linear-gradient(135deg, rgba(255,255,255,0.25) 0%, rgba(255,255,255,0.1) 100%);
            transform: translate(-50%, -50%) scale(1.05);
            box-shadow: 0 15px 40px rgba(0,0,0,0.4);
        }
        
        /* 天气UI按钮 - 极简无色图标 */
        .weather-btn {
            width: 32px;
            height: 32px;
            padding: 0;
            font-size: 18px;
            color: rgba(255,255,255,0.7);
            background: transparent;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            filter: grayscale(100%) brightness(1.5);
            opacity: 0.7;
        }
        .weather-btn:hover {
            filter: grayscale(0%) brightness(1);
            opacity: 1;
            transform: scale(1.15);
        }
        .weather-btn:active {
            transform: scale(0.95);
        }
        .weather-btn.active {
            filter: grayscale(0%) brightness(1);
            opacity: 1;
        }
        
        /* 俯视图按钮 */
        #topViewBtn {
            position: fixed;
            top: 20px;
            left: 20px;
            width: 36px;
            height: 36px;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.6);
            font-size: 20px;
            cursor: pointer;
            opacity: 0.6;
            transition: all 0.2s ease;
        }
        #topViewBtn:hover {
            opacity: 1;
            transform: scale(1.1);
        }
        #topViewBtn.active {
            opacity: 1;
            color: #00d4aa;
        }
        
        /* 移动端触摸控制 */
        #mobileControls {
            display: none;
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 200px;
            pointer-events: none;
            z-index: 1000;
        }
        
        
        /* 移动端适配 */
        @media (max-width: 768px), (pointer: coarse) {
            #mobileControls {
                display: block;
            }
            #ui {
                display: none !important;
            }
            #speedometer {
                transform: scale(0.375);
                transform-origin: top right;
                top: 10px;
                right: 10px;
                left: auto;
                bottom: auto;
            }
            #weatherUI {
                display: none !important;
            }
            #topViewBtn {
                display: none !important;
            }
        }
        
        /* 移动端方向键样式 - 水平布局 */
        .mobile-btn-group {
            position: absolute;
            bottom: 30px;
            display: flex;
            gap: 10px;
            pointer-events: auto;
        }
        #leftBtnGroup {
            left: 20px;
        }
        #rightBtnGroup {
            right: 20px;
        }
        .dpad-btn {
            width: 55px;
            height: 55px;
            background: transparent;
            border: none;
            color: rgba(255,255,255,0.4);
            font-size: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .dpad-btn:active, .dpad-btn.active {
            color: rgba(0,212,170,0.7);
        }
    </style>
</head>
<body>
    <div id="loading" class="glass-panel" style="display: none;">Loading...</div>
    <button id="startBtn" style="display: none;">START</button>
    <button id="topViewBtn" style="display: none;" title="俯视图">👁</button>
    <div id="ui" style="display: none;">
        <span class="control-item"><span class="key">W</span><span class="icon">▲</span></span>
        <span class="control-item"><span class="key">S</span><span class="icon">▼</span></span>
        <span class="control-item"><span class="key">A</span><span class="icon">◀</span></span>
        <span class="control-item"><span class="key">D</span><span class="icon">▶</span></span>
        <span class="control-item"><span class="key">Space</span><span class="icon">⏸</span></span>
    </div>
    
    <!-- 移动端控制 -->
    <div id="mobileControls">
        <!-- 左下角：前进后退 -->
        <div id="leftBtnGroup" class="mobile-btn-group">
            <div id="dpadUp" class="dpad-btn">▲</div>
            <div id="dpadDown" class="dpad-btn">▼</div>
        </div>
        <!-- 右下角：左右转向 -->
        <div id="rightBtnGroup" class="mobile-btn-group">
            <div id="dpadLeft" class="dpad-btn">◀</div>
            <div id="dpadRight" class="dpad-btn">▶</div>
        </div>
    </div>
    <div id="speedometer" style="display: none;">
        <svg viewBox="0 0 200 200">
            <!-- 外圈刻度（青色到红色渐变） -->
            <defs>
                <linearGradient id="gaugeGradient" x1="0%" y1="100%" x2="100%" y2="0%">
                    <stop offset="0%" style="stop-color:#00d4aa"/>
                    <stop offset="60%" style="stop-color:#00b8d4"/>
                    <stop offset="80%" style="stop-color:#ff6b6b"/>
                    <stop offset="100%" style="stop-color:#ff4757"/>
                </linearGradient>
            </defs>
            <!-- 背景弧 -->
            <circle cx="100" cy="100" r="85" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="8" 
                stroke-dasharray="400 134" stroke-dashoffset="-67" stroke-linecap="round"/>
            <!-- 进度弧 -->
            <circle id="speedArc" cx="100" cy="100" r="85" fill="none" stroke="url(#gaugeGradient)" stroke-width="8" 
                stroke-dasharray="0 534" stroke-dashoffset="-67" stroke-linecap="round"/>
            <!-- 刻度数字 -->
            <text x="30" y="165" fill="rgba(255,255,255,0.6)" font-size="10">0</text>
            <text x="18" y="120" fill="rgba(255,255,255,0.6)" font-size="10">30</text>
            <text x="35" y="70" fill="rgba(255,255,255,0.6)" font-size="10">60</text>
            <text x="95" y="40" fill="rgba(255,255,255,0.6)" font-size="10">90</text>
            <text x="155" y="70" fill="rgba(255,255,255,0.6)" font-size="10">120</text>
            <!-- 细刻度线 -->
            <g stroke="rgba(255,255,255,0.3)" stroke-width="1">
                <!-- 0-30间的小刻度 -->
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(9, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(18, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(27, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(36, 100, 100)"/>
                <!-- 30-60间的小刻度 -->
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(54, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(63, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(72, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(81, 100, 100)"/>
                <!-- 60-90间的小刻度 -->
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(99, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(108, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(117, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(126, 100, 100)"/>
                <!-- 90-120间的小刻度 -->
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(144, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(153, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(162, 100, 100)"/>
                <line x1="32" y1="152" x2="38" y2="147" transform="rotate(171, 100, 100)"/>
            </g>
            <!-- 主刻度线 -->
            <g stroke="rgba(255,255,255,0.5)" stroke-width="2">
                <line x1="30" y1="152" x2="40" y2="145" transform="rotate(0, 100, 100)"/>
                <line x1="30" y1="152" x2="40" y2="145" transform="rotate(45, 100, 100)"/>
                <line x1="30" y1="152" x2="40" y2="145" transform="rotate(90, 100, 100)"/>
                <line x1="30" y1="152" x2="40" y2="145" transform="rotate(135, 100, 100)"/>
                <line x1="30" y1="152" x2="40" y2="145" transform="rotate(180, 100, 100)"/>
            </g>
            <!-- 指针 -->
            <line id="speedNeedle" x1="100" y1="100" x2="100" y2="35" 
                stroke="rgba(255,255,255,0.9)" stroke-width="2" stroke-linecap="round"
                transform="rotate(-135, 100, 100)"/>
            <!-- 中心圆点 -->
            <circle cx="100" cy="100" r="6" fill="rgba(255,255,255,0.3)"/>
        </svg>
        <div class="speed-text">
            <div id="speedValue" class="speed-value">0</div>
            <div class="speed-unit">km/h</div>
        </div>
    </div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/",
            "cannon-es": "https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import * as CANNON from 'cannon-es';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { DRACOLoader } from 'three/addons/loaders/DRACOLoader.js';
        import { FontLoader } from 'three/addons/loaders/FontLoader.js';
        import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

        // ============================================
        // 全局变量
        // ============================================
        let scene, camera, renderer;
        let world;
        let vehicle, chassisBody;
        let clock;
        let envMap; // 环境贴图（用于反射）
        let carModel = null; // 外部加载的车辆模型
        let gltfLoader; // GLTF加载器
        let ferrariWheels = []; // Ferrari模型的轮子
        
        // 外部环境模型缓存
        const envModels = {
            tree: null,
            house: null,
            building: null
        };
        let modelsLoaded = false;

        // 音效系统
        let audioContext = null;
        const sounds = {
            engine: null,
            brake: null,
            reverse: null
        };
        let engineGain = null;
        let engineOscillator = null;
        let engineRunning = false;
        let audioInitialized = false;
        let isBrakingSoundPlaying = false;

        // 天气系统
        let currentWeather = 'sunny';
        let weatherParticles = null;
        let rainSound = null;
        let lightningTimer = 0;
        let snowAccumulation = 0; // 积雪量
        let groundSnowMeshes = []; // 地面积雪
        let snowflakeTexture = null; // 雪花纹理
        let isTopView = false; // 俯视图模式
        
        // 控制状态
        const controls = {
            forward: false,
            backward: false,
            left: false,
            right: false,
            brake: false
        };

        // 车辆参数（优化后的配置 - 超稳底盘）
        const vehicleConfig = {
            maxSteerVal: 0.45,
            maxForce: 800,
            brakeForce: 60,
            chassisMass: 500,
            wheelRadius: 0.35,
            wheelWidth: 0.25,
            suspensionStiffness: 55,  // 适中悬挂
            suspensionRestLength: 0.3, // 悬挂长度
            frictionSlip: 3.5,
            dampingRelaxation: 3,
            dampingCompression: 4.5,
            rollInfluence: 0.0001,
            maxSpeed: 120
        };

        // 当前转向值（用于平滑转向）
        let currentSteerVal = 0;
        const steerSpeed = 0.05; // 转向平滑速度

        // 相机控制参数（鼠标视角）
        let cameraAngleH = 0;  // 水平角度（无限制，可360度旋转）
        let cameraAngleV = 0.15; // 垂直角度（PC端默认，接近水平视角）
        let cameraDistance = 15; // 相机距离
        
        // 检测是否为移动端
        const isMobile = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(navigator.userAgent) || window.matchMedia('(pointer: coarse)').matches;
        let isMouseDown = false;
        let lastMouseX = 0;
        let lastMouseY = 0;

        // 存储物理和渲染对象的映射
        const objectsToUpdate = [];
        const wheelMeshes = [];
        
        // 存储树木用于碰撞检测
        const trees = [];
        let lastCollisionTime = 0;
        
        // 存储金属底座用于碰撞检测
        const metalBases = [];
        let lastMetalCollisionTime = 0;
        
        // 存储湖中的鱼
        const fishes = [];

        // ============================================
        // 初始化函数
        // ============================================
        async function init() {
            // 创建场景
            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x87ceeb); // 天空蓝
            scene.fog = new THREE.Fog(0x87ceeb, 100, 500);

            // 创建相机
            camera = new THREE.PerspectiveCamera(
                60,
                window.innerWidth / window.innerHeight,
                0.1,
                1000
            );
            // 设置相机初始位置在车辆后方（车辆初始位置在圆心，朝向X正方向）
            camera.position.set(-15, 10, 0);
            
            // 移动端设置更高的初始俯视角度
            if (isMobile) {
                cameraAngleV = 0.85; // 更高的俯视角度
                cameraDistance = 18; // 稍远的距离
            }

            // 创建渲染器（支持物理材质）
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            renderer.toneMapping = THREE.ACESFilmicToneMapping;
            renderer.toneMappingExposure = 1.2;
            renderer.outputColorSpace = THREE.SRGBColorSpace;
            document.body.appendChild(renderer.domElement);

            // 创建时钟
            clock = new THREE.Clock();

            // 创建环境贴图（用于车漆反射）
            createEnvironmentMap();

            // 初始化物理世界
            initPhysics();

            // 添加灯光
            addLights();

            // 创建地面
            createGround();

            // 创建车辆
            createVehicle();

            // 程序化生成地图
            generateMap();

            // 添加天空盒效果
            addSkyDome();

            // 初始化天气系统
            initWeatherSystem();

            // 设置事件监听
            setupEventListeners();

            // 隐藏加载提示，直接显示UI
            document.getElementById('loading').style.display = 'none';
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('ui').style.display = 'block';
            document.getElementById('speedometer').style.display = 'block';
            document.getElementById('topViewBtn').style.display = 'block';
            
            // 音效系统需要用户交互才能启动，监听第一次交互
            const startAudio = () => {
                initAudioSystem();
                document.removeEventListener('click', startAudio);
                document.removeEventListener('keydown', startAudio);
            };
            document.addEventListener('click', startAudio);
            document.addEventListener('keydown', startAudio);
            
            // 俯视图按钮点击事件
            document.getElementById('topViewBtn').addEventListener('click', () => {
                isTopView = !isTopView;
                document.getElementById('topViewBtn').classList.toggle('active', isTopView);
            });

            // 开始动画循环
            animate();
        }

        // ============================================
        // 创建环境贴图（用于车漆反射效果）
        // ============================================
        function createEnvironmentMap() {
            // 使用渐变色生成简单的环境贴图
            const pmremGenerator = new THREE.PMREMGenerator(renderer);
            pmremGenerator.compileEquirectangularShader();

            // 创建简单的环境场景
            const envScene = new THREE.Scene();
            
            // 添加渐变背景
            const skyColor = new THREE.Color(0x87ceeb);
            const groundColor = new THREE.Color(0x333333);
            
            // 上半球（天空）
            const skyGeometry = new THREE.SphereGeometry(50, 32, 32, 0, Math.PI * 2, 0, Math.PI / 2);
            const skyMaterial = new THREE.MeshBasicMaterial({ 
                color: skyColor, 
                side: THREE.BackSide 
            });
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            envScene.add(sky);
            
            // 下半球（地面反射）
            const groundGeometry = new THREE.SphereGeometry(50, 32, 32, 0, Math.PI * 2, Math.PI / 2, Math.PI / 2);
            const groundMaterial = new THREE.MeshBasicMaterial({ 
                color: groundColor, 
                side: THREE.BackSide 
            });
            const ground = new THREE.Mesh(groundGeometry, groundMaterial);
            envScene.add(ground);

            // 生成环境贴图
            envMap = pmremGenerator.fromScene(envScene, 0.04).texture;
            scene.environment = envMap;
            
            pmremGenerator.dispose();
        }

        // ============================================
        // 物理世界初始化
        // ============================================
        function initPhysics() {
            world = new CANNON.World();
            world.gravity.set(0, -9.82, 0);
            world.broadphase = new CANNON.SAPBroadphase(world);
            world.defaultContactMaterial.friction = 0.3;
            
            // 创建地面材质
            const groundMaterial = new CANNON.Material('ground');
            const wheelMaterial = new CANNON.Material('wheel');
            
            // 轮子与地面的接触材质
            const wheelGroundContact = new CANNON.ContactMaterial(
                wheelMaterial,
                groundMaterial,
                {
                    friction: 0.5,
                    restitution: 0.3,
                    contactEquationStiffness: 1000
                }
            );
            world.addContactMaterial(wheelGroundContact);
        }

        // ============================================
        // 灯光设置
        // ============================================
        function addLights() {
            // 环境光
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
            scene.add(ambientLight);

            // 方向光（太阳）
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(100, 100, 50);
            directionalLight.castShadow = true;
            
            // 阴影配置
            directionalLight.shadow.mapSize.width = 2048;
            directionalLight.shadow.mapSize.height = 2048;
            directionalLight.shadow.camera.near = 0.5;
            directionalLight.shadow.camera.far = 500;
            directionalLight.shadow.camera.left = -150;
            directionalLight.shadow.camera.right = 150;
            directionalLight.shadow.camera.top = 150;
            directionalLight.shadow.camera.bottom = -150;
            
            scene.add(directionalLight);

            // 半球光（模拟天空和地面的反射）
            const hemisphereLight = new THREE.HemisphereLight(0x87ceeb, 0x444444, 0.3);
            scene.add(hemisphereLight);
        }

        // ============================================
        // 创建地面（深绿色草地 + 弯曲道路）
        // ============================================
        function createGround() {
            const groundRadius = 250;
            
            // 深绿色草地（圆形）
            const groundMaterial = new THREE.MeshStandardMaterial({
                color: 0x2d5a27,
                roughness: 0.9,
                metalness: 0.0,
                side: THREE.DoubleSide
            });
            
            const groundGeometry = new THREE.CircleGeometry(groundRadius, 128);
            const groundMesh = new THREE.Mesh(groundGeometry, groundMaterial);
            groundMesh.name = 'ground';
            groundMesh.rotation.x = -Math.PI / 2;
            groundMesh.receiveShadow = true;
            scene.add(groundMesh);

            // 创建弯曲道路
            createCurvedRoad();

            // Cannon.js 地面
            const groundShape = new CANNON.Plane();
            const groundBody = new CANNON.Body({
                mass: 0,
                material: new CANNON.Material('ground')
            });
            groundBody.addShape(groundShape);
            groundBody.quaternion.setFromEuler(-Math.PI / 2, 0, 0);
            world.addBody(groundBody);
        }

        // 存储道路点用于树木避让
        let roadPathPoints = [];
        
        // 太极图湖泊位置（阴阳鱼眼）
        const lakePositions = [
            { x: 0, z: 90, r: 18 },   // 阴极（上方鱼眼）
            { x: 0, z: -90, r: 18 }   // 阳极（下方鱼眼）
        ];
        
        // 创建太极道路
        function createCurvedRoad() {
            const roadWidth = 10;
            const roadColor = 0x3a3a3a;
            const lineColor = 0xffffff;
            const radius = 180;
            const halfR = radius / 2;
            
            // 外圈圆形道路点
            const outerPoints = [];
            for (let i = 0; i <= 100; i++) {
                const angle = (i / 100) * Math.PI * 2;
                outerPoints.push(new THREE.Vector3(
                    Math.sin(angle) * radius,
                    0.02,
                    -Math.cos(angle) * radius
                ));
            }
            
            // 太极S形道路：由两个精确半圆组成
            const sPoints = [];
            
            // 上半圆：从顶部(0, radius)到中心(0, 0)，圆心在(0, halfR)
            for (let i = 0; i <= 40; i++) {
                const angle = (i / 40) * Math.PI;
                sPoints.push(new THREE.Vector3(
                    Math.sin(angle) * halfR,
                    0.02,
                    halfR + Math.cos(angle) * halfR
                ));
            }
            
            // 下半圆：从中心(0, 0)到底部(0, -radius)，圆心在(0, -halfR)
            for (let i = 1; i <= 40; i++) {
                const angle = (i / 40) * Math.PI;
                sPoints.push(new THREE.Vector3(
                    -Math.sin(angle) * halfR,
                    0.02,
                    -halfR + Math.cos(angle) * halfR
                ));
            }
            
            // 存储所有道路点用于避让
            roadPathPoints = [...outerPoints, ...sPoints];
            
            // 绘制道路的通用函数
            function drawRoad(points) {
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    
                    const dir = new THREE.Vector3().subVectors(p2, p1).normalize();
                    const perp = new THREE.Vector3(-dir.z, 0, dir.x);
                    const p2Extended = p2.clone().add(dir.clone().multiplyScalar(1.0));
                    
                    const v1 = new THREE.Vector3().addVectors(p1, perp.clone().multiplyScalar(roadWidth/2));
                    const v2 = new THREE.Vector3().addVectors(p1, perp.clone().multiplyScalar(-roadWidth/2));
                    const v3 = new THREE.Vector3().addVectors(p2Extended, perp.clone().multiplyScalar(-roadWidth/2));
                    const v4 = new THREE.Vector3().addVectors(p2Extended, perp.clone().multiplyScalar(roadWidth/2));
                    
                    const roadGeo = new THREE.BufferGeometry();
                    const vertices = new Float32Array([
                        v1.x, v1.y, v1.z, v2.x, v2.y, v2.z, v3.x, v3.y, v3.z,
                        v1.x, v1.y, v1.z, v3.x, v3.y, v3.z, v4.x, v4.y, v4.z
                    ]);
                    roadGeo.setAttribute('position', new THREE.BufferAttribute(vertices, 3));
                    roadGeo.computeVertexNormals();
                    
                    const roadMat = new THREE.MeshStandardMaterial({ 
                        color: roadColor, roughness: 0.8, side: THREE.DoubleSide
                    });
                    const roadMesh = new THREE.Mesh(roadGeo, roadMat);
                    roadMesh.receiveShadow = true;
                    scene.add(roadMesh);
                }
            }
            
            // 绘制两条道路
            drawRoad(outerPoints);
            drawRoad(sPoints);
            
            // 道路中心虚线
            function drawDashedLine(points) {
                const dashLength = 3, gapLength = 3;
                let accumulated = 0, isDash = true;
                
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    
                    if (isDash) {
                        const lineGeo = new THREE.BufferGeometry().setFromPoints([
                            new THREE.Vector3(p1.x, 0.03, p1.z),
                            new THREE.Vector3(p2.x, 0.03, p2.z)
                        ]);
                        scene.add(new THREE.Line(lineGeo, new THREE.LineBasicMaterial({ color: lineColor })));
                    }
                    
                    accumulated += p1.distanceTo(p2);
                    if (accumulated > (isDash ? dashLength : gapLength)) {
                        accumulated = 0;
                        isDash = !isDash;
                    }
                }
            }
            
            drawDashedLine(outerPoints);
            drawDashedLine(sPoints);
            
            // 方案二：只保留虚线，无边线
            
            // 创建八卦方位广告牌
            createBaguaSigns(radius);
        }
        
        // 创建八卦方位广告牌

            const bagua = [

                { name: '艮', symbol: [1,0,0], dir: '东北', angle: 45 },
                { name: '震', symbol: [0,0,1], dir: '东', angle: 90 },
                { name: '巽', symbol: [1,1,0], dir: '东南', angle: 135 },
                { name: '离', symbol: [1,0,1], dir: '南', angle: 180 },
                { name: '坤', symbol: [0,0,0], dir: '西南', angle: 225 },
                { name: '兑', symbol: [0,1,1], dir: '西', angle: 270 },

            const poleHeight = 12;
            const panelWidth = 18;

                const x = Math.cos(angleRad) * signDistance;
                const z = Math.sin(angleRad) * signDistance;
                
                // 计算朝向圆心的角度
                const faceAngle = Math.atan2(-x, -z);
                
                // 六边形底座
                const baseGeo = new THREE.CylinderGeometry(2.5, 3, 1, 6);
                const baseMat = new THREE.MeshStandardMaterial({ 
                    color: 0x2a2a2a, metalness: 0.8, roughness: 0.3

                base.position.set(x, 0.5, z);
                base.rotation.y = faceAngle;
                base.castShadow = true;
                base.receiveShadow = true;

                // 存储底座位置用于金属碰撞检测
                metalBases.push({ x: x, z: z, radius: 3.5 });
                
                // 单支撑杆
                const poleMat = new THREE.MeshStandardMaterial({ 
                    color: 0x8b4513, metalness: 0.4, roughness: 0.6 
                });
                const poleGeo = new THREE.CylinderGeometry(0.3, 0.4, poleHeight, 8);
                const pole = new THREE.Mesh(poleGeo, poleMat);
                pole.position.set(x, poleHeight/2 + 1, z);
                pole.castShadow = true;
                scene.add(pole);
                
                
                // 创建LCD面板纹理
                const canvas = document.createElement('canvas');
                canvas.width = 512;
                canvas.height = 256;
                const ctx = canvas.getContext('2d');
                
                // LCD背景（深色渐变）
                const gradient = ctx.createLinearGradient(0, 0, 0, 256);
                gradient.addColorStop(0, '#0a0a15');
                gradient.addColorStop(0.5, '#151525');
                gradient.addColorStop(1, '#0a0a15');
                ctx.fillStyle = gradient;
                ctx.fillRect(0, 0, 512, 256);
                
                // 金色边框
                ctx.strokeStyle = '#c9a227';
                ctx.lineWidth = 6;
                ctx.strokeRect(8, 8, 496, 240);
                ctx.strokeStyle = '#8b6914';
                ctx.lineWidth = 2;
                ctx.strokeRect(14, 14, 484, 228);
                
                // 左侧：卦象符号（三爻）
                const yaoY = [180, 128, 76];
                gua.symbol.forEach((yang, i) => {
                    ctx.fillStyle = '#e8d5a3';
                    if (yang === 1) {
                        // 阳爻（实线）
                        ctx.fillRect(50, yaoY[i] - 8, 100, 16);
                    } else {
                        // 阴爻（断线）
                        ctx.fillRect(50, yaoY[i] - 8, 40, 16);
                        ctx.fillRect(110, yaoY[i] - 8, 40, 16);
                    }
                });
                
                // 中间：卦名（大字）
                ctx.fillStyle = '#f5e6c8';
                ctx.font = 'bold 140px "SimSun", "宋体", serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.shadowColor = '#c9a227';
                ctx.shadowBlur = 15;
                ctx.fillText(gua.name, 280, 128);
                ctx.shadowBlur = 0;
                
                // 右侧：方位
                ctx.fillStyle = '#a0a0a0';
                ctx.font = '36px "SimSun", serif';
                ctx.fillText(gua.dir, 440, 128);
                
                // 顶部装饰线
                ctx.strokeStyle = '#c9a227';
                ctx.lineWidth = 2;
                ctx.beginPath();
                ctx.moveTo(180, 40);
                ctx.lineTo(380, 40);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(180, 216);
                ctx.lineTo(380, 216);
                ctx.stroke();
                
                // 创建双面LCD面板
                const texture = new THREE.CanvasTexture(canvas);
                texture.anisotropy = 16;
                
                // 面板外框（金属质感）
                const frameGeo = new THREE.BoxGeometry(panelWidth + 0.8, panelHeight + 0.8, 0.6);
                const frameMat = new THREE.MeshStandardMaterial({ 
                    color: 0x1a1a1a, metalness: 0.9, roughness: 0.2
                });
                const frame = new THREE.Mesh(frameGeo, frameMat);
                frame.position.set(x, poleHeight + panelHeight/2 + 1.5, z);
                frame.rotation.y = faceAngle;
                frame.castShadow = true;
                scene.add(frame);
                
                // 正面LCD屏幕
                const screenMat = new THREE.MeshStandardMaterial({ 
                    map: texture, 
                    emissive: 0xffffff,
                    emissiveMap: texture,
                    emissiveIntensity: 0.15
                });
                const screenGeo = new THREE.PlaneGeometry(panelWidth, panelHeight);
                
                const screenFront = new THREE.Mesh(screenGeo, screenMat);
                screenFront.position.set(x, poleHeight + panelHeight/2 + 1.5, z);
                screenFront.rotation.y = faceAngle;
                screenFront.translateZ(0.35);
                scene.add(screenFront);
                
                // 背面LCD屏幕
                const screenBack = new THREE.Mesh(screenGeo, screenMat);
                screenBack.position.set(x, poleHeight + panelHeight/2 + 1.5, z);

                });

                signBody.addShape(new CANNON.Cylinder(2.5, 3, 1, 6), new CANNON.Vec3(0, -poleHeight/2 - 4.5, 0));
                // 支撑杆碰撞
                signBody.addShape(new CANNON.Cylinder(0.4, 0.4, poleHeight, 8), new CANNON.Vec3(0, -4, 0));
                // 面板碰撞
                signBody.addShape(new CANNON.Box(new CANNON.Vec3(panelWidth/2 + 0.5, panelHeight/2 + 0.5, 1)), new CANNON.Vec3(0, panelHeight/2 + 1.5, 0));
                world.addBody(signBody);
            });
        }

        // ============================================
        // 创建车辆（加载外部3D模型）
        // ============================================
        function createVehicle() {
            // 车身物理尺寸
            const chassisWidth = 1.8;
            const chassisHeight = 0.5;
            const chassisLength = 4.5;

            // 创建车身容器
            const chassisGroup = new THREE.Group();

            // === 初始化GLTF加载器 ===
            gltfLoader = new GLTFLoader();
            
            // 设置Draco解码器（用于压缩模型）
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
            gltfLoader.setDRACOLoader(dracoLoader);

            // Three.js 官方 Ferrari 跑车模型
            const ferrariUrl = 'https://threejs.org/examples/models/gltf/ferrari.glb';

            // 加载 Ferrari 模型
            console.log('🔄 正在加载 Ferrari 跑车模型...');
            
            gltfLoader.load(
                ferrariUrl,
                (gltf) => {
                    carModel = gltf.scene;
                    
                    // Ferrari 模型参数调整
                    carModel.scale.set(0.5, 0.5, 0.5);
                    carModel.position.set(0, -0.45, 0); // 下移让车贴地
                    carModel.rotation.y = Math.PI; // 车头朝前
                    
                    // 为模型添加阴影和增强材质
                    carModel.traverse((child) => {
                        if (child.isMesh) {
                            child.castShadow = true;
                            child.receiveShadow = true;
                            
                            if (child.material) {
                                child.material.envMap = envMap;
                                child.material.envMapIntensity = 2.0;
                                child.material.needsUpdate = true;
                            }
                        }
                    });
                    
                    chassisGroup.add(carModel);
                    
                    // 隐藏备用轮子（Ferrari模型自带轮子）
                    wheelMeshes.forEach(wheel => {
                        wheel.visible = false;
                    });
                    
                    // 查找Ferrari模型中的轮子
                    ferrariWheels = [];
                    carModel.traverse((child) => {
                        // Ferrari模型轮子名称通常包含 'wheel'
                        if (child.name && child.name.toLowerCase().includes('wheel')) {
                            ferrariWheels.push(child);
                            console.log('找到轮子:', child.name);
                        }
                    });
                    
                    console.log('🚗 Ferrari 跑车模型加载成功！找到', ferrariWheels.length, '个轮子');
                },
                (progress) => {
                    if (progress.total > 0) {
                        const percent = Math.round((progress.loaded / progress.total) * 100);
                        console.log(`加载进度: ${percent}%`);
                    }
                },
                (error) => {
                    console.warn('Ferrari 模型加载失败，使用备用模型:', error.message);
                }
            );

            scene.add(chassisGroup);

            // ---- Cannon.js 车身物理体 ----
            const chassisShape = new CANNON.Box(new CANNON.Vec3(
                chassisWidth / 2,
                chassisHeight / 2,
                chassisLength / 2
            ));
            chassisBody = new CANNON.Body({
                mass: vehicleConfig.chassisMass,
                material: new CANNON.Material('chassis')
            });
            chassisBody.addShape(chassisShape);
            // 初始位置在圆心，车头沿着道路方向
            chassisBody.position.set(0, 1, 0);
            chassisBody.quaternion.setFromEuler(0, Math.PI / 2, 0); // 车头朝向X正方向（沿道路）

            // ---- 创建RaycastVehicle ----
            vehicle = new CANNON.RaycastVehicle({
                chassisBody: chassisBody,
                indexRightAxis: 0,
                indexUpAxis: 1,
                indexForwardAxis: 2
            });

            // 轮子配置
            const wheelOptions = {
                radius: vehicleConfig.wheelRadius,
                directionLocal: new CANNON.Vec3(0, -1, 0),
                suspensionStiffness: vehicleConfig.suspensionStiffness,
                suspensionRestLength: vehicleConfig.suspensionRestLength,
                frictionSlip: vehicleConfig.frictionSlip,
                dampingRelaxation: vehicleConfig.dampingRelaxation,
                dampingCompression: vehicleConfig.dampingCompression,
                maxSuspensionForce: 100000,
                rollInfluence: vehicleConfig.rollInfluence,
                axleLocal: new CANNON.Vec3(-1, 0, 0),
                chassisConnectionPointLocal: new CANNON.Vec3(),
                maxSuspensionTravel: 0.5,
                customSlidingRotationalSpeed: -30,
                useCustomSlidingRotationalSpeed: true
            };

            // 轮子位置（连接点在车身底部）
            const wheelPositions = [
                new CANNON.Vec3(-chassisWidth / 2 + 0.15, -0.2, chassisLength * 0.32),   // 前左
                new CANNON.Vec3(chassisWidth / 2 - 0.15, -0.2, chassisLength * 0.32),    // 前右
                new CANNON.Vec3(-chassisWidth / 2 + 0.15, -0.2, -chassisLength * 0.32),  // 后左
                new CANNON.Vec3(chassisWidth / 2 - 0.15, -0.2, -chassisLength * 0.32)    // 后右
            ];

            // 添加轮子（跑车风格轮毂）
            wheelPositions.forEach((pos, index) => {
                wheelOptions.chassisConnectionPointLocal.copy(pos);
                vehicle.addWheel(wheelOptions);

                // 创建跑车风格轮子（模型加载后会隐藏）
                const wheelGroup = new THREE.Group();
                const isLeftWheel = index % 2 === 0;
                const wheelR = vehicleConfig.wheelRadius;

                // 轮胎材质
                const tireMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x1a1a1a,
                    metalness: 0,
                    roughness: 0.85
                });

                // === 轮胎 ===
                const tireGeometry = new THREE.TorusGeometry(wheelR * 0.8, wheelR * 0.2, 24, 48);
                const tire = new THREE.Mesh(tireGeometry, tireMaterial);
                tire.rotation.y = Math.PI / 2;
                tire.castShadow = true;
                wheelGroup.add(tire);

                // 轮胎侧壁
                const tireSideGeometry = new THREE.RingGeometry(wheelR * 0.58, wheelR * 1.0, 48);
                const tireSideMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x111111,
                    metalness: 0,
                    roughness: 0.9,
                    side: THREE.DoubleSide
                });
                [-1, 1].forEach(side => {
                    const tireSide = new THREE.Mesh(tireSideGeometry, tireSideMaterial);
                    tireSide.rotation.y = Math.PI / 2;
                    tireSide.position.x = side * vehicleConfig.wheelWidth * 0.35;
                    wheelGroup.add(tireSide);
                });

                // === 跑车轮毂（5辐Y型） ===
                const hubMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x222222,
                    metalness: 0.95,
                    roughness: 0.1,
                    envMapIntensity: 2.0
                });
                const hubGeometry = new THREE.CylinderGeometry(wheelR * 0.58, wheelR * 0.58, vehicleConfig.wheelWidth * 0.6, 32);
                hubGeometry.rotateZ(Math.PI / 2);
                const hub = new THREE.Mesh(hubGeometry, hubMaterial);
                wheelGroup.add(hub);

                // Y型辐条（5个）
                const spokeMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x333333,
                    metalness: 0.9,
                    roughness: 0.15,
                    envMapIntensity: 1.5
                });
                for (let i = 0; i < 5; i++) {
                    const angle = (i / 5) * Math.PI * 2;
                    const spokeGeometry = new THREE.BoxGeometry(0.08, wheelR * 0.5, 0.15);
                    const spoke = new THREE.Mesh(spokeGeometry, spokeMaterial);
                    spoke.position.set(
                        0,
                        Math.cos(angle) * wheelR * 0.28,
                        Math.sin(angle) * wheelR * 0.28
                    );
                    spoke.rotation.x = angle;
                    wheelGroup.add(spoke);
                }

                // 中心盖（红色）
                const capGeometry = new THREE.CylinderGeometry(wheelR * 0.15, wheelR * 0.15, 0.1, 20);
                capGeometry.rotateZ(Math.PI / 2);
                const capMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0xff0000,
                    metalness: 0.8,
                    roughness: 0.2,
                    clearcoat: 1.0
                });
                const cap = new THREE.Mesh(capGeometry, capMaterial);
                cap.position.x = isLeftWheel ? -0.08 : 0.08;
                wheelGroup.add(cap);

                wheelGroup.visible = false; // 默认隐藏，等Ferrari模型加载后用它的轮子
                scene.add(wheelGroup);
                wheelMeshes.push(wheelGroup);
            });

            vehicle.addToWorld(world);

            // 存储车身映射
            objectsToUpdate.push({
                mesh: chassisGroup,
                body: chassisBody
            });
        }

        // ============================================
        // 程序化地图生成
        // ============================================
        
        // 检查点是否在道路上
        function isOnRoad(x, z, margin = 8) {
            for (const p of roadPathPoints) {
                const dist = Math.sqrt((x - p.x) ** 2 + (z - p.z) ** 2);
                if (dist < margin) return true;
            }
            return false;
        }
        
        // 检查点是否在湖泊中
        function isInLake(x, z, margin = 5) {
            for (const lake of lakePositions) {
                const dist = Math.sqrt((x - lake.x) ** 2 + (z - lake.z) ** 2);
                if (dist < lake.r + margin) return true;
            }
            return false;
        }
        
        function generateMap() {
            const mapRadius = 230; // 圆形地图半径
            const safeZone = 15;

            console.log('🏙️ 开始生成地图...');

            // 生成树木（避开道路和湖泊，只在圆形范围内）
            let treeCount = 0;
            let attempts = 0;
            while (treeCount < 80 && attempts < 400) {
                // 在圆形范围内随机生成
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * mapRadius;
                const x = Math.cos(angle) * dist;
                const z = Math.sin(angle) * dist;
                attempts++;
                
                // 避开出生点、道路、湖泊和欢迎文字区域
                if (Math.abs(x) < safeZone && Math.abs(z) < safeZone) continue;
                if (isOnRoad(x, z)) continue;
                if (isInLake(x, z)) continue;
                // 避开欢迎文字区域（x: -30到30, z: -35到-5）
                if (x > -35 && x < 35 && z > -40 && z < 0) continue;
                
                createTree(x, z);
                treeCount++;
            }

            // 在固定位置生成湖泊
            for (const lake of lakePositions) {
                createLake(lake.x, lake.z);
            }

            console.log('🏙️ 地图生成完成！');
            
            // 创建3D立体文字
            // create3DText(); // 已删除八卦广告牌旁的英文字母
            createWelcomeText();
            createGroundInstructions();
            createPortals(); // 创建传送门
        }
        
        // 创建中文欢迎文字（3D立体效果，类似BRUNO风格）
        function createWelcomeText() {
            const text = '欢迎光临兰的空间';
            const textGroup = new THREE.Group();
            
            const planeWidth = 50;
            const planeHeight = 6;
            const depth = 2.5; // 立体深度
            const layers = 80; // 更多层数让侧面更实
            
            // 创建不同亮度的纹理层（模拟光照渐变）
            function createTextCanvas(color, shadowOffset = 0) {
                const canvas = document.createElement('canvas');
                const ctx = canvas.getContext('2d');
                canvas.width = 1024;
                canvas.height = 128;
                
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // 添加阴影效果
                if (shadowOffset > 0) {
                    ctx.shadowColor = 'rgba(0,0,0,0.3)';
                    ctx.shadowBlur = 2;
                    ctx.shadowOffsetX = shadowOffset;
                    ctx.shadowOffsetY = shadowOffset;
                }
                
                ctx.fillStyle = color;
                ctx.font = 'bold 90px "Microsoft YaHei", "SimHei", "Helvetica Neue", Arial, sans-serif';
                ctx.textAlign = 'center';
                ctx.textBaseline = 'middle';
                ctx.fillText(text, canvas.width / 2, canvas.height / 2);
                
                return canvas;
            }
            
            // 创建前面（最亮）
            const frontCanvas = createTextCanvas('#ffffff', 2);
            const frontTexture = new THREE.CanvasTexture(frontCanvas);
            
            // 创建中间层（渐变灰色）
            const textures = [];
            for (let i = 0; i < 5; i++) {
                const brightness = Math.floor(220 - i * 25); // 从亮到暗
                const color = `rgb(${brightness},${brightness},${brightness})`;
                const canvas = createTextCanvas(color, 0);
                textures.push(new THREE.CanvasTexture(canvas));
            }
            
            // 创建每一层
            for (let i = 0; i < layers; i++) {
                const progress = i / (layers - 1); // 0到1
                
                let texture;
                if (i === layers - 1) {
                    // 最前面 - 纯白
                    texture = frontTexture;
                } else {
                    // 根据深度选择渐变纹理
                    const texIndex = Math.min(Math.floor(progress * 5), 4);
                    texture = textures[texIndex];
                }
                
                const material = new THREE.MeshBasicMaterial({
                    map: texture,
                    transparent: true,
                    alphaTest: 0.5,
                    side: THREE.DoubleSide,
                    depthWrite: true
                });
                
                const geometry = new THREE.PlaneGeometry(planeWidth, planeHeight);
                const mesh = new THREE.Mesh(geometry, material);
                
                // 从后往前排列，模拟立体深度
                mesh.position.z = progress * depth - depth;
                mesh.position.x = -progress * 0.8; // 轻微X偏移模拟透视
                mesh.position.y = -progress * 0.3; // 轻微Y偏移模拟阴影
                
                textGroup.add(mesh);
            }
            
            // 放置在车旁边的空地上，底端紧贴地面，倾斜一点角度
            textGroup.position.set(0, planeHeight / 2 + 0.5, -22);
            textGroup.rotation.x = -0.1; // 轻微前倾
            textGroup.rotation.y = 0.15; // 轻微侧转，增加立体感
            
            scene.add(textGroup);
        }

        // 创建旋转粒子传送门
        function createPortals() {

        function createSinglePortal(x, z, url, label) {
            const portalGroup = new THREE.Group();
            portalGroup.position.set(x, 0, z);
            
            const portalRadius = 5;
            const portalHeight = 8;
            
            // 传送门中心高度（向地面移动30%）
            const portalCenterY = (portalRadius + 1) * 0.7;
            
            // 外环（紫色光环）
            const outerRingGeo = new THREE.TorusGeometry(portalRadius, 0.4, 16, 64);
            const outerRingMat = new THREE.MeshBasicMaterial({ 
                color: 0x9932cc,
                transparent: true,
                opacity: 0.9
            });
            const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
            outerRing.position.y = portalCenterY;
            portalGroup.add(outerRing);
            
            // 内环（亮紫色能量）
            const innerRingGeo = new THREE.TorusGeometry(portalRadius - 0.8, 0.3, 16, 64);
            const innerRingMat = new THREE.MeshBasicMaterial({ 
                color: 0xda70d6,
                transparent: true,
                opacity: 0.8
            });
            const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
            innerRing.position.y = portalCenterY;
            portalGroup.add(innerRing);
            
            // 中心漩涡（半透明紫色圆盘）
            const vortexGeo = new THREE.CircleGeometry(portalRadius - 1.2, 32);
            const vortexMat = new THREE.MeshBasicMaterial({
                color: 0x8a2be2,
                transparent: true,
                opacity: 0.6,
                side: THREE.DoubleSide
            });
            const vortex = new THREE.Mesh(vortexGeo, vortexMat);
            vortex.position.y = portalCenterY;
            portalGroup.add(vortex);
            
            // 创建旋转粒子系统
            const particleCount = 200;
            const particleGeo = new THREE.BufferGeometry();
            const positions = new Float32Array(particleCount * 3);
            const colors = new Float32Array(particleCount * 3);
            const sizes = new Float32Array(particleCount);
            const angles = new Float32Array(particleCount);
            const radii = new Float32Array(particleCount);
            const speeds = new Float32Array(particleCount);
            
            const centerY = portalCenterY; // 垂直传送门中心高度（已向地面移动30%）
            
            for (let i = 0; i < particleCount; i++) {
                angles[i] = Math.random() * Math.PI * 2;
                radii[i] = portalRadius * 0.6 + Math.random() * portalRadius * 0.6;
                speeds[i] = 0.8 + Math.random() * 1.5;
                
                // 粒子在垂直平面上（XY平面）旋转
                positions[i * 3] = Math.cos(angles[i]) * radii[i];
                positions[i * 3 + 1] = centerY + Math.sin(angles[i]) * radii[i];
                positions[i * 3 + 2] = (Math.random() - 0.5) * 1; // Z轴轻微偏移
                
                // 紫色到粉色的粒子
                const colorMix = Math.random();
                colors[i * 3] = 0.6 + colorMix * 0.4;
                colors[i * 3 + 1] = 0.2 + colorMix * 0.3;
                colors[i * 3 + 2] = 0.8 + colorMix * 0.2;
                
                sizes[i] = 0.15 + Math.random() * 0.35;
            }
            
            particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
            particleGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
            particleGeo.setAttribute('size', new THREE.BufferAttribute(sizes, 1));
            
            const particleMat = new THREE.PointsMaterial({
                size: 0.3,
                vertexColors: true,
                transparent: true,
                opacity: 0.8,
                blending: THREE.AdditiveBlending,
                depthWrite: false
            });
            
            const particles = new THREE.Points(particleGeo, particleMat);
            portalGroup.add(particles);
            
            // 存储粒子动画数据
            portalParticles.push({
                particles: particles,
                angles: angles,
                radii: radii,
                speeds: speeds,
                centerY: centerY
            });
            
            // 创建标签
            const labelCanvas = document.createElement('canvas');
            const labelCtx = labelCanvas.getContext('2d');
            labelCanvas.width = 256;
            labelCanvas.height = 64;
            labelCtx.fillStyle = '#da70d6';
            labelCtx.font = 'bold 40px "Microsoft YaHei", Arial';
            labelCtx.textAlign = 'center';
            labelCtx.textBaseline = 'middle';
            labelCtx.fillText(label, 128, 32);
            
            const labelTexture = new THREE.CanvasTexture(labelCanvas);
            const labelGeo = new THREE.PlaneGeometry(5, 1.2);
            const labelMat = new THREE.MeshBasicMaterial({
                map: labelTexture,
                transparent: true,
                side: THREE.DoubleSide
            });
            const labelMesh = new THREE.Mesh(labelGeo, labelMat);
            labelMesh.position.y = portalCenterY + portalRadius + 1.5; // 标签在传送门上方
            portalGroup.add(labelMesh);
            
            scene.add(portalGroup);
            
            // 存储传送门数据用于碰撞检测
            portals.push({
                group: portalGroup,
                x: x,
                z: z,
                radius: portalRadius,
                height: portalHeight,
                url: url,
                outerRing: outerRing,
                innerRing: innerRing,
                vortex: vortex,
                triggered: false
            });
        }
        
        // 更新传送门动画
        function updatePortals(deltaTime) {
            const time = performance.now() * 0.001;
            
            // 更新粒子旋转（在垂直XY平面上）
            portalParticles.forEach(data => {
                const positions = data.particles.geometry.attributes.position.array;
                const particleCount = data.angles.length;
                
                for (let i = 0; i < particleCount; i++) {
                    data.angles[i] += data.speeds[i] * deltaTime * 2;
                    
                    // 粒子在垂直平面（XY）上旋转
                    positions[i * 3] = Math.cos(data.angles[i]) * data.radii[i];
                    positions[i * 3 + 1] = data.centerY + Math.sin(data.angles[i]) * data.radii[i];
                    positions[i * 3 + 2] = Math.sin(time * 2 + i * 0.1) * 0.5; // Z轴轻微波动
                }
                
                data.particles.geometry.attributes.position.needsUpdate = true;
            });
            
            // 更新环的旋转和脉动
            portals.forEach(portal => {
                portal.outerRing.rotation.z += deltaTime * 0.5;
                portal.innerRing.rotation.z -= deltaTime * 0.8;
                portal.vortex.rotation.z += deltaTime * 1.2;
                
                // 脉动效果
                const pulse = 1 + Math.sin(time * 3) * 0.1;
                portal.outerRing.scale.setScalar(pulse);
                portal.vortex.material.opacity = 0.4 + Math.sin(time * 2) * 0.2;
            });
        }
        
        // 检测传送门碰撞
        function checkPortalCollision() {
            if (!chassisBody) return;
            
            const carX = chassisBody.position.x;
            const carZ = chassisBody.position.z;
            
            portals.forEach(portal => {
                if (portal.triggered) return;
                
                const dx = carX - portal.x;
                const dz = carZ - portal.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                // 当车辆进入传送门一半距离时触发
                if (dist < portal.radius * 0.5) {
                    portal.triggered = true;
                    console.log('🌀 进入传送门！跳转到:', portal.url);
                    
                    // 添加过渡效果
                    const overlay = document.createElement('div');
                    overlay.style.cssText = `
                        position: fixed;
                        top: 0;
                        left: 0;
                        width: 100%;
                        height: 100%;
                        background: radial-gradient(circle, #4488ff 0%, #000 100%);
                        opacity: 0;
                        z-index: 9999;
                        transition: opacity 0.5s;
                    `;
                    document.body.appendChild(overlay);
                    
                    setTimeout(() => overlay.style.opacity = '1', 10);
                    setTimeout(() => window.location.href = portal.url, 600);
                }
            });
        }
        
        // 创建3D立体白色文字（带物理和传送门）
        function create3DText() {
            const fontLoader = new FontLoader();
            
            // 加载字体
            fontLoader.load('https://threejs.org/examples/fonts/helvetiker_bold.typeface.json', (font) => {
                const textMaterial = new THREE.MeshStandardMaterial({
                    color: 0xffffff,
                    roughness: 0.3,
                    metalness: 0.1
                });
                
                // 文字配置（远离道路的位置）
                const texts = [
                    { text: 'GAME', x: 140, z: 140, rotY: -Math.PI / 4, scale: 0.6 },
                    { text: 'MUSIC', x: -140, z: 140, rotY: Math.PI / 4, scale: 0.5 },
                    { text: 'BAZI', x: 140, z: -140, rotY: Math.PI / 4, scale: 0.5 },
                    { text: 'MINGLI', x: -140, z: -140, rotY: -Math.PI / 4, scale: 0.45 }
                ];
                
                texts.forEach(config => {
                    const letterSpacing = 3 * config.scale;
                    let offsetX = 0;
                    
                    // 创建时空隧道圆环（在首字母前）
                    createPortalRing(config.x, config.z, config.rotY, config.scale);
                    
                    // 为每个字母创建独立的mesh和物理体
                    for (let i = 0; i < config.text.length; i++) {
                        const char = config.text[i];
                        if (char === ' ') {
                            offsetX += letterSpacing;
                            continue;
                        }
                        
                        const charGeometry = new TextGeometry(char, {
                            font: font,
                            size: 3 * config.scale,
                            height: 0.5,
                            curveSegments: 8,
                            bevelEnabled: true,
                            bevelThickness: 0.05,
                            bevelSize: 0.03,
                            bevelOffset: 0,
                            bevelSegments: 2
                        });
                        
                        charGeometry.computeBoundingBox();
                        const charWidth = charGeometry.boundingBox.max.x - charGeometry.boundingBox.min.x;
                        const charHeight = charGeometry.boundingBox.max.y - charGeometry.boundingBox.min.y;
                        
                        const charMesh = new THREE.Mesh(charGeometry, textMaterial.clone());
                        
                        // 计算位置（考虑旋转）
                        const localX = offsetX - (config.text.length * letterSpacing) / 2 + 8;
                        const worldX = config.x + localX * Math.cos(config.rotY);
                        const worldZ = config.z + localX * Math.sin(config.rotY);
                        
                        charMesh.position.set(worldX, charHeight / 2, worldZ);
                        charMesh.rotation.set(0, config.rotY, 0);
                        charMesh.castShadow = true;
                        charMesh.receiveShadow = true;
                        scene.add(charMesh);
                        textMeshes.push(charMesh);
                        
                        // 创建物理体
                        const charBody = new CANNON.Body({
                            mass: 5,  // 可被撞倒
                            position: new CANNON.Vec3(worldX, charHeight / 2, worldZ),
                            shape: new CANNON.Box(new CANNON.Vec3(charWidth / 2, charHeight / 2, 0.3)),
                            linearDamping: 0.5,
                            angularDamping: 0.5
                        });
                        charBody.quaternion.setFromEuler(0, config.rotY, 0);
                        world.addBody(charBody);
                        textBodies.push(charBody);
                        
                        offsetX += charWidth + letterSpacing * 0.5;
                    }
                });
                
                console.log('🔤 3D文字已创建（带物理引擎）');
            });
        }
        
        // 创建时空隧道圆环
        function createPortalRing(x, z, rotY, scale) {
            const ringGroup = new THREE.Group();
            
            // 外圈发光环
            const outerRingGeo = new THREE.TorusGeometry(4 * scale, 0.3 * scale, 16, 48);
            const outerRingMat = new THREE.MeshBasicMaterial({
                color: 0x00ffff,
                transparent: true,
                opacity: 0.8
            });
            const outerRing = new THREE.Mesh(outerRingGeo, outerRingMat);
            ringGroup.add(outerRing);
            
            // 内圈
            const innerRingGeo = new THREE.TorusGeometry(3 * scale, 0.2 * scale, 16, 48);
            const innerRingMat = new THREE.MeshBasicMaterial({
                color: 0x8844ff,
                transparent: true,
                opacity: 0.6
            });
            const innerRing = new THREE.Mesh(innerRingGeo, innerRingMat);
            ringGroup.add(innerRing);
            
            // 中心漩涡效果
            const spiralGeo = new THREE.CircleGeometry(2.5 * scale, 32);
            const spiralMat = new THREE.MeshBasicMaterial({
                color: 0x000022,
                transparent: true,
                opacity: 0.7,
                side: THREE.DoubleSide
            });
            const spiral = new THREE.Mesh(spiralGeo, spiralMat);
            ringGroup.add(spiral);
            
            // 位置在文字前方
            const portalX = x - 10 * Math.cos(rotY);
            const portalZ = z - 10 * Math.sin(rotY);
            ringGroup.position.set(portalX, 3 * scale, portalZ);
            ringGroup.rotation.set(0, rotY + Math.PI / 2, 0);
            
            scene.add(ringGroup);
            portalRings.push({ group: ringGroup, outer: outerRing, inner: innerRing });
        }
        
        // 更新3D文字物理
        function updateTextPhysics() {
            for (let i = 0; i < textBodies.length; i++) {
                if (textMeshes[i] && textBodies[i]) {
                    textMeshes[i].position.copy(textBodies[i].position);
                    textMeshes[i].quaternion.copy(textBodies[i].quaternion);
                }
            }
            
            // 旋转传送门
            const time = Date.now() * 0.001;
            portalRings.forEach((portal, i) => {
                portal.outer.rotation.z = time * 0.5;
                portal.inner.rotation.z = -time * 0.8;
                // 脉冲发光效果
                portal.outer.material.opacity = 0.6 + Math.sin(time * 2 + i) * 0.2;
            });
        }

        // 加载外部环境模型
        async function loadEnvironmentModels() {
            const loader = new GLTFLoader();
            const dracoLoader = new DRACOLoader();
            dracoLoader.setDecoderPath('https://www.gstatic.com/draco/versioned/decoders/1.5.6/');
            loader.setDRACOLoader(dracoLoader);

            // 模型URL列表（使用更精细的免费模型）
            const modelUrls = {
                tree: 'https://vazxmixjsiawhamofees.supabase.co/storage/v1/object/public/models/tree-lime/model.gltf',
                house: 'https://vazxmixjsiawhamofees.supabase.co/storage/v1/object/public/models/building-korean-house/model.gltf',
                bench: 'https://vazxmixjsiawhamofees.supabase.co/storage/v1/object/public/models/bench-2/model.gltf',
                streetlamp: 'https://vazxmixjsiawhamofees.supabase.co/storage/v1/object/public/models/street-lamp/model.gltf'
            };

            const loadModel = (name, url) => {
                return new Promise((resolve) => {
                    loader.load(
                        url,
                        (gltf) => {
                            envModels[name] = gltf.scene;
                            // 为模型添加阴影
                            gltf.scene.traverse((child) => {
                                if (child.isMesh) {
                                    child.castShadow = true;
                                    child.receiveShadow = true;
                                }
                            });
                            console.log(`✅ ${name} 模型加载成功`);
                            resolve();
                        },
                        undefined,
                        (error) => {
                            console.warn(`⚠️ ${name} 模型加载失败:`, error.message);
                            resolve(); // 失败也继续
                        }
                    );
                });
            };

            // 并行加载所有模型
            await Promise.all([
                loadModel('tree', modelUrls.tree),
                loadModel('house', modelUrls.house),
                loadModel('cactus', modelUrls.cactus)
            ]);

            modelsLoaded = true;
        }

        function createBuilding(x, z, width, height, depth) {
