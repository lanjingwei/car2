        // 将setWeather暴露到全局作用域（供按钮onclick调用）
        window.setWeather = function(weather) {
            currentWeather = weather;
            const sky = scene.getObjectByName('sky');
            
            // 更新按钮状态
            document.querySelectorAll('.weather-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // 控制阴影（只有晴天有阴影）
            const enableShadows = (weather === 'sunny');
            scene.traverse(obj => {
                if (obj.isMesh && obj.castShadow !== undefined) {
                    obj.castShadow = enableShadows;
                }
            });
            
            // 隐藏所有天体
            if (sunMesh) sunMesh.visible = false;
            if (moonMesh) moonMesh.visible = false;
            if (starsGroup) starsGroup.visible = false;
            if (cloudsGroup) {
                cloudsGroup.visible = false;
                // 重置云颜色为白色
                cloudsGroup.children.forEach(c => c.children.forEach(p => {
                    if (p.material) p.material.color.setHex(0xffffff);
                }));
            }
            
            // 如果不是下雪天，重置积雪和地面颜色
            if (weather !== 'snow') {
                snowAccumulation = 0;
                const ground = scene.getObjectByName('ground');
                if (ground && ground.material) {
                    ground.material.color.setHex(0x2d5a27); // 恢复绿色
                }
                // 重置雪花落地状态和粒子位置
                if (weatherParticles && weatherParticles.geometry) {
                    const positions = weatherParticles.geometry.attributes.position.array;
                    const settled = weatherParticles.geometry.userData.settled;
                    for (let i = 0; i < settled.length; i++) {
                        settled[i] = 0;
                        // 将所有粒子重置到天空（足够高以避免可见）
                        positions[i * 3] = (Math.random() - 0.5) * 180;
                        positions[i * 3 + 1] = 200 + Math.random() * 100; // 更高的位置
                        positions[i * 3 + 2] = (Math.random() - 0.5) * 180;
                    }
                    weatherParticles.geometry.attributes.position.needsUpdate = true;
                }
                // 移除雪花纹理并重置材质
                if (weatherParticles && weatherParticles.material) {
                    weatherParticles.material.map = null;
                    weatherParticles.material.alphaTest = 0;  // 重置 alphaTest
                    weatherParticles.material.opacity = 0.6;
                    weatherParticles.material.needsUpdate = true;
                }
            }
            
            switch (weather) {
                case 'sunny':
                    weatherParticles.visible = false;
                    if (sunMesh) sunMesh.visible = true;
                    if (cloudsGroup) cloudsGroup.visible = true;
                    if (sky && sky.material.uniforms) {
                        sky.material.uniforms.topColor.value.setHex(0x0077ff);
                        sky.material.uniforms.bottomColor.value.setHex(0xaaddff);
                    }
                    scene.traverse(obj => {
                        if (obj.isAmbientLight) obj.intensity = 0.6;
                        if (obj.isDirectionalLight) obj.intensity = 1.2;
                    });
                    break;
                    
                case 'night':
                    weatherParticles.visible = false;
                    if (moonMesh) moonMesh.visible = true;
                    if (starsGroup) starsGroup.visible = true;
                    if (sky && sky.material.uniforms) {
                        sky.material.uniforms.topColor.value.setHex(0x0a0a20);
                        sky.material.uniforms.bottomColor.value.setHex(0x1a1a3a);
                    }
                    scene.traverse(obj => {
                        if (obj.isAmbientLight) obj.intensity = 0.15;
                        if (obj.isDirectionalLight) obj.intensity = 0.2;
                    });
                    break;
                    
                case 'rain':
                    weatherParticles.visible = true;
                    weatherParticles.material.color.setHex(0x8888ff);
                    weatherParticles.material.size = 0.15;
                    // 重置粒子到车辆周围
                    resetParticlesAroundCar();
                    if (cloudsGroup) {
                        cloudsGroup.visible = true;
                        cloudsGroup.children.forEach(c => c.children.forEach(p => {
                            if (p.material) p.material.color.setHex(0x555566);
                        }));
                    }
                    if (sky && sky.material.uniforms) {
                        sky.material.uniforms.topColor.value.setHex(0x445566);
                        sky.material.uniforms.bottomColor.value.setHex(0x778899);
                    }
                    scene.traverse(obj => {
                        if (obj.isAmbientLight) obj.intensity = 0.4;
                        if (obj.isDirectionalLight) obj.intensity = 0.5;
                    });
                    break;
                    
                case 'snow':
                    weatherParticles.visible = true;
                    weatherParticles.material.color.setHex(0xffffff);
                    weatherParticles.material.size = 0.4;
                    weatherParticles.material.map = snowflakeTexture;
                    weatherParticles.material.alphaTest = 0.1;
                    weatherParticles.material.needsUpdate = true;
                    // 下雪天没有云
                    if (cloudsGroup) cloudsGroup.visible = false;
                    if (sky && sky.material.uniforms) {
                        sky.material.uniforms.topColor.value.setHex(0x8899aa);
                        sky.material.uniforms.bottomColor.value.setHex(0xddeeff);
                    }
                    scene.traverse(obj => {
                        if (obj.isAmbientLight) obj.intensity = 0.5;
                        if (obj.isDirectionalLight) obj.intensity = 0.7;
                    });
                    // 重置积雪
                    snowAccumulation = 0;
                    break;
                    
                case 'storm':
                    weatherParticles.visible = true;
                    weatherParticles.material.color.setHex(0x6666aa);
                    weatherParticles.material.size = 0.2;
                    // 重置粒子到车辆周围
                    resetParticlesAroundCar();
                    if (cloudsGroup) {
                        cloudsGroup.visible = true;
                        cloudsGroup.children.forEach(c => c.children.forEach(p => {
                            if (p.material) p.material.color.setHex(0x333344);
                        }));
                    }
                    if (sky && sky.material.uniforms) {
                        sky.material.uniforms.topColor.value.setHex(0x222233);
                        sky.material.uniforms.bottomColor.value.setHex(0x445566);
                    }
                    scene.traverse(obj => {
                        if (obj.isAmbientLight) obj.intensity = 0.2;
                        if (obj.isDirectionalLight) obj.intensity = 0.3;
                    });
                    lightningTimer = 0;
                    break;
            }
            
            console.log(`天气已切换为: ${weather}`);
        }

        function updateWeather(deltaTime) {
            if (!weatherParticles || !weatherParticles.visible) return;
            
            const positions = weatherParticles.geometry.attributes.position.array;
            const settled = weatherParticles.geometry.userData.settled;
            const carPos = chassisBody ? chassisBody.position : { x: 0, z: 0 };
            
            // 粒子下落速度
            let fallSpeed = currentWeather === 'snow' ? 5 : 25;
            let windX = currentWeather === 'storm' ? Math.sin(Date.now() * 0.001) * 5 : 0;
            
            // 雪花轻微飘动
            const snowDrift = currentWeather === 'snow' ? Math.sin(Date.now() * 0.002) * 0.5 : 0;
            
            for (let i = 0; i < positions.length; i += 3) {
                const idx = i / 3;
                
                // 如果雪花已落地，快速重置
                if (currentWeather === 'snow' && settled[idx] > 0) {
                    settled[idx] += deltaTime;
                    // 1秒后重置到天上（更快的循环）
                    if (settled[idx] > 1) {
                        positions[i] = carPos.x + (Math.random() - 0.5) * 120;
                        positions[i + 1] = 60 + Math.random() * 40;
                        positions[i + 2] = carPos.z + (Math.random() - 0.5) * 120;
                        settled[idx] = 0;
                    }
                    continue;
                }
                
                positions[i] += (windX + snowDrift) * deltaTime;
                positions[i + 1] -= fallSpeed * deltaTime;
                
                // 到达地面
                if (positions[i + 1] < 0.1) {
                    if (currentWeather === 'snow') {
                        // 雪花落地
                        positions[i + 1] = 0.05;
                        settled[idx] = 0.01; // 开始计时
                        snowAccumulation += 0.0002;
                        
                        // 地面逐渐变白
                        if (snowAccumulation < 1) {
                            const ground = scene.getObjectByName('ground');
                            if (ground && ground.material) {
                                const whiteness = Math.min(snowAccumulation, 0.7);
                                const r = 0.18 + whiteness * 0.82;
                                const g = 0.35 + whiteness * 0.65;
                                const b = 0.15 + whiteness * 0.85;
                                ground.material.color.setRGB(r, g, b);
                            }
                        }
                    } else {
                        // 雨水重置到顶部（更密集的范围）
                        positions[i] = carPos.x + (Math.random() - 0.5) * 120;
                        positions[i + 1] = 60 + Math.random() * 40;
                        positions[i + 2] = carPos.z + (Math.random() - 0.5) * 120;
                    }
                }
            }
            
            weatherParticles.geometry.attributes.position.needsUpdate = true;
            
            // 暴风雨闪电效果
            if (currentWeather === 'storm') {
                lightningTimer += deltaTime;
                if (lightningTimer > 3 + Math.random() * 5) {
                    lightning();
                    lightningTimer = 0;
                }
            }
        }

        // 闪电几何体
        let lightningBolt = null;

        function createLightningBolt() {
            // 创建闪电形状
            const points = [];
            let x = (Math.random() - 0.5) * 100;
            let y = 80;
            let z = (Math.random() - 0.5) * 100;
            
            points.push(new THREE.Vector3(x, y, z));
            
            // 生成锯齿形闪电路径
            while (y > 0) {
                y -= 5 + Math.random() * 10;
                x += (Math.random() - 0.5) * 15;
                z += (Math.random() - 0.5) * 15;
                points.push(new THREE.Vector3(x, Math.max(y, 0), z));
            }
            
            const geometry = new THREE.BufferGeometry().setFromPoints(points);
            const material = new THREE.LineBasicMaterial({
                color: 0xffffcc,
                linewidth: 3,
                transparent: true,
                opacity: 1
            });
            
            return new THREE.Line(geometry, material);
        }

        function lightning() {
            // 创建闪电视觉效果
            if (lightningBolt) {
                scene.remove(lightningBolt);
            }
            lightningBolt = createLightningBolt();
            scene.add(lightningBolt);
            
            // 闪电闪烁 + 天空闪白
            const sky = scene.getObjectByName('sky');
            let originalTopColor, originalBottomColor;
            if (sky && sky.material.uniforms) {
                originalTopColor = sky.material.uniforms.topColor.value.clone();
                originalBottomColor = sky.material.uniforms.bottomColor.value.clone();
                sky.material.uniforms.topColor.value.setHex(0xffffff);
                sky.material.uniforms.bottomColor.value.setHex(0xccccff);
            }
            
            // 环境光闪烁
            scene.traverse(obj => {
                if (obj.isAmbientLight) {
                    const originalIntensity = obj.intensity;
                    obj.intensity = 3;
                    setTimeout(() => { obj.intensity = 0.5; }, 80);
                    setTimeout(() => { obj.intensity = 2.5; }, 120);
                    setTimeout(() => { obj.intensity = originalIntensity; }, 200);
                }
            });
            
            // 恢复天空颜色
            setTimeout(() => {
                if (sky && sky.material.uniforms && originalTopColor) {
                    sky.material.uniforms.topColor.value.copy(originalTopColor);
                    sky.material.uniforms.bottomColor.value.copy(originalBottomColor);
                }
            }, 150);
            
            // 移除闪电
            setTimeout(() => {
                if (lightningBolt) {
                    scene.remove(lightningBolt);
                    lightningBolt = null;
                }
            }, 200);
            
            // 雷声（更真实的多层噪音）
            if (audioContext) {
                // 延迟雷声（模拟光速 vs 声速）
                const delay = 0.3 + Math.random() * 0.5;
                
                setTimeout(() => {
                    // 低频隆隆声
                    const bufferSize = audioContext.sampleRate * 2;
                    const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
                    const data = buffer.getChannelData(0);
                    
                    // 生成雷声波形
                    for (let i = 0; i < bufferSize; i++) {
                        const t = i / audioContext.sampleRate;
                        // 衰减的噪音 + 低频隆隆
                        const envelope = Math.exp(-t * 2);
                        const noise = (Math.random() * 2 - 1) * 0.5;
                        const rumble = Math.sin(t * 30) * 0.3 + Math.sin(t * 50) * 0.2;
                        data[i] = (noise + rumble) * envelope;
                    }
                    
                    const source = audioContext.createBufferSource();
                    source.buffer = buffer;
                    
                    const gainNode = audioContext.createGain();
                    gainNode.gain.setValueAtTime(0.4, audioContext.currentTime);
                    
                    // 低通滤波器让声音更沉闷
                    const filter = audioContext.createBiquadFilter();
                    filter.type = 'lowpass';
                    filter.frequency.setValueAtTime(400, audioContext.currentTime);
                    
                    source.connect(filter);
                    filter.connect(gainNode);
                    gainNode.connect(audioContext.destination);
                    
                    source.start();
                }, delay * 1000);
            }
        }

        // ============================================
        // 事件监听器
        // ============================================
        function setupEventListeners() {
            // 键盘按下（阻止默认行为避免页面滚动）
            window.addEventListener('keydown', (e) => {
                switch (e.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        controls.forward = true;
                        e.preventDefault();
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        controls.backward = true;
                        e.preventDefault();
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        controls.left = true;
                        e.preventDefault();
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        controls.right = true;
                        e.preventDefault();
                        break;
                    case 'Space':
                        controls.brake = true;
                        e.preventDefault();
                        break;
                }
            });

            // 键盘释放
            window.addEventListener('keyup', (e) => {
                switch (e.code) {
                    case 'KeyW':
                    case 'ArrowUp':
                        controls.forward = false;
                        break;
                    case 'KeyS':
                    case 'ArrowDown':
                        controls.backward = false;
                        break;
                    case 'KeyA':
                    case 'ArrowLeft':
                        controls.left = false;
                        break;
                    case 'KeyD':
                    case 'ArrowRight':
                        controls.right = false;
                        break;
                    case 'Space':
                        controls.brake = false;
                        break;
                }
            });

            // 窗口大小调整
            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });

            // === 鼠标视角控制 ===
            renderer.domElement.addEventListener('mousedown', (e) => {
                isMouseDown = true;
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            window.addEventListener('mouseup', () => {
                isMouseDown = false;
            });

            window.addEventListener('mousemove', (e) => {
                if (!isMouseDown) return;
                
                const deltaX = e.clientX - lastMouseX;
                const deltaY = e.clientY - lastMouseY;
                
                cameraAngleH -= deltaX * 0.008;  // 增加水平灵敏度
                cameraAngleV += deltaY * 0.008;  // 增加垂直灵敏度
                
                // 扩大垂直角度范围（-0.5到1.57，接近完全俯视/仰视）
                cameraAngleV = Math.max(-0.5, Math.min(1.57, cameraAngleV));
                
                lastMouseX = e.clientX;
                lastMouseY = e.clientY;
            });

            // 滚轮缩放
            renderer.domElement.addEventListener('wheel', (e) => {
                cameraDistance += e.deltaY * 0.01;
                cameraDistance = Math.max(5, Math.min(25, cameraDistance));
                e.preventDefault();
            }, { passive: false });
            
            // === 移动端触摸控制 ===
            setupMobileControls();
        }
        
        // 移动端控制设置（方向键版本 + 手势视角控制）
        function setupMobileControls() {
            const dpadUp = document.getElementById('dpadUp');
            const dpadDown = document.getElementById('dpadDown');
            const dpadLeft = document.getElementById('dpadLeft');
            const dpadRight = document.getElementById('dpadRight');
            
            if (!dpadUp) return;
            
            // 初始化音效系统（手机端首次触摸时初始化）
            let mobileAudioInitialized = false;
            const initMobileAudio = () => {
                if (!mobileAudioInitialized) {
                    initAudioSystem();
                    mobileAudioInitialized = true;
                }
            };
            
            // 方向键通用处理函数
            function setupDpadButton(btn, controlKey) {
                btn.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    initMobileAudio(); // 首次触摸时初始化音效
                    controls[controlKey] = true;
                    btn.classList.add('active');
                }, { passive: false });
                
                btn.addEventListener('touchend', (e) => {
                    e.preventDefault();
                    controls[controlKey] = false;
                    btn.classList.remove('active');
                }, { passive: false });
                
                btn.addEventListener('touchcancel', (e) => {
                    controls[controlKey] = false;
                    btn.classList.remove('active');
                });
            }
            
            // 设置四个方向键
            setupDpadButton(dpadUp, 'forward');
            setupDpadButton(dpadDown, 'backward');
            setupDpadButton(dpadLeft, 'left');
            setupDpadButton(dpadRight, 'right');
            
            // === 手势控制视角 ===
            let touchStartX = 0;
            let touchStartY = 0;
            let isSwiping = false;
            
            // 在画布上添加触摸事件用于控制视角
            // 双指缩放变量
            let initialPinchDistance = 0;
            let isPinching = false;
            
            renderer.domElement.addEventListener('touchstart', (e) => {
                // 排除按钮区域
                if (e.target.closest('#mobileControls')) return;
                
                initMobileAudio(); // 首次触摸时初始化音效
                
                if (e.touches.length === 1) {
                    isSwiping = true;
                    isPinching = false;
                    touchStartX = e.touches[0].clientX;
                    touchStartY = e.touches[0].clientY;
                } else if (e.touches.length === 2) {
                    // 双指缩放开始
                    isSwiping = false;
                    isPinching = true;
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    initialPinchDistance = Math.sqrt(dx * dx + dy * dy);
                }
            }, { passive: true });
            
            renderer.domElement.addEventListener('touchmove', (e) => {
                if (e.touches.length === 1 && isSwiping && !isPinching) {
                    // 单指拖动视角
                    const touch = e.touches[0];
                    const deltaX = touch.clientX - touchStartX;
                    const deltaY = touch.clientY - touchStartY;
                    
                    // 更新相机角度（灵敏度调整）
                    cameraAngleH -= deltaX * 0.008;
                    cameraAngleV += deltaY * 0.005;
                    
                    // 限制垂直角度
                    cameraAngleV = Math.max(0.1, Math.min(1.2, cameraAngleV));
                    
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                } else if (e.touches.length === 2 && isPinching) {
                    // 双指缩放
                    const dx = e.touches[0].clientX - e.touches[1].clientX;
                    const dy = e.touches[0].clientY - e.touches[1].clientY;
                    const currentPinchDistance = Math.sqrt(dx * dx + dy * dy);
                    
                    if (initialPinchDistance > 0) {
                        const pinchDelta = (initialPinchDistance - currentPinchDistance) * 0.05;
                        cameraDistance += pinchDelta;
                        cameraDistance = Math.max(5, Math.min(25, cameraDistance));
                    }
                    
                    initialPinchDistance = currentPinchDistance;
                }
            }, { passive: true });
            
            renderer.domElement.addEventListener('touchend', (e) => {
                if (e.touches.length < 2) {
                    isPinching = false;
                }
                if (e.touches.length === 0) {
                    isSwiping = false;
                }
            }, { passive: true });
            
            // 阻止按钮区域的默认触摸行为（防止页面滚动）
            document.addEventListener('touchmove', (e) => {
                if (e.target.closest('#mobileControls')) {
                    e.preventDefault();
                }
            }, { passive: false });
        }

        // ============================================
        // 更新车辆控制（优化版：平滑转向 + 速度感应）
        // ============================================
        function updateVehicleControls() {
            const maxSteerVal = vehicleConfig.maxSteerVal;
            const maxForce = vehicleConfig.maxForce;
            const brakeForce = vehicleConfig.brakeForce;

            // 计算当前速度
            const velocity = chassisBody.velocity;
            const currentSpeed = Math.sqrt(velocity.x * velocity.x + velocity.z * velocity.z);
            const speedFactor = Math.max(0.3, 1 - currentSpeed / 50); // 速度越快转向越小

            // 判断车辆前进方向
            const forwardDir = new THREE.Vector3(0, 0, -1);
            forwardDir.applyQuaternion(new THREE.Quaternion(
                chassisBody.quaternion.x,
                chassisBody.quaternion.y,
                chassisBody.quaternion.z,
                chassisBody.quaternion.w
            ));
            const movingForward = (velocity.x * forwardDir.x + velocity.z * forwardDir.z) < 0;

            // === 引擎力控制（四轮驱动） ===
            const speedKmh = currentSpeed * 3.6; // 转换为km/h
            const maxSpeed = vehicleConfig.maxSpeed || 120;
            
            if (controls.forward) {
                // 清除刹车
                vehicle.setBrake(0, 0);
                vehicle.setBrake(0, 1);
                vehicle.setBrake(0, 2);
                vehicle.setBrake(0, 3);
                
                // 速度限制：接近上限时减小动力
                let forceMult = 1.0;
                if (speedKmh > maxSpeed * 0.8) {
                    forceMult = Math.max(0, 1 - (speedKmh - maxSpeed * 0.8) / (maxSpeed * 0.2));
                }
                
                // 加速：四轮驱动
                vehicle.applyEngineForce(-maxForce * 0.4 * forceMult, 0);
                vehicle.applyEngineForce(-maxForce * 0.4 * forceMult, 1);
                vehicle.applyEngineForce(-maxForce * 0.6 * forceMult, 2);
                vehicle.applyEngineForce(-maxForce * 0.6 * forceMult, 3);
            } else if (controls.backward) {
                // 判断是否需要刹车还是倒车
                if (movingForward && currentSpeed > 1) {
                    // 正在前进且速度较快，先刹车
                    // 四轮均匀制动 + 反向推力稳定车尾
                    vehicle.applyEngineForce(0, 0);
                    vehicle.applyEngineForce(0, 1);
                    // 后轮施加轻微反向力防止翘起
                    vehicle.applyEngineForce(brakeForce * 0.3, 2);
                    vehicle.applyEngineForce(brakeForce * 0.3, 3);
                    // 均匀刹车
                    vehicle.setBrake(brakeForce * 1.5, 0);
                    vehicle.setBrake(brakeForce * 1.5, 1);
                    vehicle.setBrake(brakeForce * 2.0, 2); // 后轮稍多
                    vehicle.setBrake(brakeForce * 2.0, 3);
                    
                    // 急刹车音效
                    if (speedKmh > 30 && !isBrakingSoundPlaying) {
                        playBrakingSound();
                    }
                } else {
                    // 倒车：四轮驱动，更流畅
                    vehicle.setBrake(0, 0);
                    vehicle.setBrake(0, 1);
                    vehicle.setBrake(0, 2);
                    vehicle.setBrake(0, 3);
                    vehicle.applyEngineForce(maxForce * 0.35, 0);
                    vehicle.applyEngineForce(maxForce * 0.35, 1);
                    vehicle.applyEngineForce(maxForce * 0.5, 2);
                    vehicle.applyEngineForce(maxForce * 0.5, 3);
                }
            } else {
                // 无输入时自然减速
                vehicle.applyEngineForce(0, 0);
                vehicle.applyEngineForce(0, 1);
                vehicle.applyEngineForce(0, 2);
                vehicle.applyEngineForce(0, 3);
                
                // 轻微的引擎制动
                if (currentSpeed > 0.5) {
                    vehicle.setBrake(brakeForce * 0.08, 0);
                    vehicle.setBrake(brakeForce * 0.08, 1);
                    vehicle.setBrake(brakeForce * 0.08, 2);
                    vehicle.setBrake(brakeForce * 0.08, 3);
                } else {
                    vehicle.setBrake(0, 0);
                    vehicle.setBrake(0, 1);
                    vehicle.setBrake(0, 2);
                    vehicle.setBrake(0, 3);
                }
            }

            // === 平滑转向控制 ===
            let targetSteer = 0;
            if (controls.left) {
                targetSteer = maxSteerVal * speedFactor;
            } else if (controls.right) {
                targetSteer = -maxSteerVal * speedFactor;
            }

            // 平滑插值转向值
            currentSteerVal += (targetSteer - currentSteerVal) * steerSpeed * (currentSpeed > 5 ? 2 : 4);
            
            // 回正时加快速度
            if (targetSteer === 0) {
                currentSteerVal *= 0.9;
            }
            
            // 应用转向
            vehicle.setSteeringValue(currentSteerVal, 0);
            vehicle.setSteeringValue(currentSteerVal, 1);

            // === 手刹控制 ===
            if (controls.brake) {
                // 手刹主要锁定后轮
                vehicle.setBrake(brakeForce * 3, 2);
                vehicle.setBrake(brakeForce * 3, 3);
                vehicle.setBrake(brakeForce * 0.5, 0);
                vehicle.setBrake(brakeForce * 0.5, 1);
            }
        }

        // 平滑跟随目标位置（用于消除抖动）
        // 初始化为车辆初始位置（圆心），避免相机从原点缓慢移动到车辆位置导致开始时看不到车
        let smoothCarPosition = new THREE.Vector3(0, 1, 0);
        let smoothLookAt = new THREE.Vector3(0, 2, 0);
        let smoothYaw = Math.PI / 2; // 与车辆初始朝向一致（沿道路）

        // ============================================
        // 相机跟随（鼠标可控制视角）- 防抖动版
        // ============================================
        function updateCamera() {
            if (!chassisBody) return;

            // 俯视图模式
            if (isTopView) {
                const topViewHeight = 350;
                const targetPos = new THREE.Vector3(0, topViewHeight, 0);
                camera.position.lerp(targetPos, 0.08);
                camera.lookAt(0, 0, 0);
                return;
            }

            // 获取车辆实际位置
            const actualCarPosition = new THREE.Vector3(
                chassisBody.position.x,
                Math.max(chassisBody.position.y, 0.5),
                chassisBody.position.z
            );

            // 平滑车辆位置（关键：消除物理引擎的微小抖动）
            smoothCarPosition.lerp(actualCarPosition, 0.15);

            // 获取车辆水平朝向
            const carQuat = new THREE.Quaternion(
                chassisBody.quaternion.x,
                chassisBody.quaternion.y,
                chassisBody.quaternion.z,
                chassisBody.quaternion.w
            );
            const carEuler = new THREE.Euler().setFromQuaternion(carQuat, 'YXZ');
            
            // 平滑角度变化
            let targetYaw = carEuler.y;
            // 处理角度循环（避免从-PI跳到PI时的问题）
            let yawDiff = targetYaw - smoothYaw;
            if (yawDiff > Math.PI) yawDiff -= Math.PI * 2;
            if (yawDiff < -Math.PI) yawDiff += Math.PI * 2;
            smoothYaw += yawDiff * 0.1;

            // 计算相机位置（球面坐标）
            const totalAngleH = smoothYaw + cameraAngleH;
            const cameraX = Math.sin(totalAngleH) * Math.cos(cameraAngleV) * cameraDistance;
            const cameraY = Math.sin(cameraAngleV) * cameraDistance + 3;
            const cameraZ = Math.cos(totalAngleH) * Math.cos(cameraAngleV) * cameraDistance;

            const targetCameraPosition = new THREE.Vector3(
                smoothCarPosition.x + cameraX,
                smoothCarPosition.y + cameraY,
                smoothCarPosition.z + cameraZ
            );

            // 平滑插值相机位置（较大的系数使跟随更紧密）
            camera.position.lerp(targetCameraPosition, 0.12);

            // 平滑插值lookAt目标
            const targetLookAt = new THREE.Vector3(
                smoothCarPosition.x,
                smoothCarPosition.y + 1,
                smoothCarPosition.z
            );
            smoothLookAt.lerp(targetLookAt, 0.15);
            
            camera.lookAt(smoothLookAt);
        }

        // ============================================
        // 更新速度显示（圆形仪表盘）
        // ============================================
        function updateSpeedDisplay() {
            if (!chassisBody) return;

            const velocity = chassisBody.velocity;
            const speed = Math.sqrt(
                velocity.x * velocity.x +
                velocity.z * velocity.z
            );
            
            // 转换为 km/h
            const speedKmh = Math.round(speed * 3.6);
            const maxSpeed = vehicleConfig.maxSpeed || 120;
            
            // 更新数字显示
            document.getElementById('speedValue').textContent = speedKmh;
            
            // 更新指针角度（-135度到135度，共270度范围）
            const speedRatio = Math.min(speedKmh / maxSpeed, 1);
            const angle = -135 + speedRatio * 270;
            const needle = document.getElementById('speedNeedle');
            if (needle) {
                needle.setAttribute('transform', `rotate(${angle}, 100, 100)`);
            }
            
            // 更新进度弧（总弧长约400）
            const arcLength = speedRatio * 400;
            const speedArc = document.getElementById('speedArc');
            if (speedArc) {
                speedArc.setAttribute('stroke-dasharray', `${arcLength} 534`);
            }
        }

        // ============================================
        // 动画循环
        // ============================================
        function animate() {
            requestAnimationFrame(animate);

            const deltaTime = clock.getDelta();

            // 更新车辆控制
            updateVehicleControls();

            // 更新物理世界
            world.step(1 / 60, deltaTime, 3);

            // === 防止翻车：自动扶正 ===
            const q = chassisBody.quaternion;
            const euler = new THREE.Euler().setFromQuaternion(
                new THREE.Quaternion(q.x, q.y, q.z, q.w), 'YXZ'
            );
            
            // 检测是否倾斜过大
            if (Math.abs(euler.x) > 0.5 || Math.abs(euler.z) > 0.5) {
                // 逐渐扶正车辆
                const correctQuat = new CANNON.Quaternion();
                correctQuat.setFromEuler(0, euler.y, 0); // 只保留Y轴旋转
                chassisBody.quaternion.slerp(correctQuat, 0.05, chassisBody.quaternion);
                
                // 减少角速度
                chassisBody.angularVelocity.x *= 0.9;
                chassisBody.angularVelocity.z *= 0.9;
            }
            
            // 限制角速度防止翻转
            const maxAngularVel = 3;
            chassisBody.angularVelocity.x = Math.max(-maxAngularVel, Math.min(maxAngularVel, chassisBody.angularVelocity.x));
            chassisBody.angularVelocity.z = Math.max(-maxAngularVel, Math.min(maxAngularVel, chassisBody.angularVelocity.z));

            // 更新3D文字物理和传送门动画
            updateTextPhysics();
            updatePortals(deltaTime); // 更新传送门动画
            checkPortalCollision(); // 检测传送门碰撞
            
            // 同步物理体和渲染网格
            objectsToUpdate.forEach(obj => {
                obj.mesh.position.copy(obj.body.position);
                obj.mesh.quaternion.copy(obj.body.quaternion);
            });

            // 更新轮子并计算地面高度
            let lowestWheelY = Infinity;
            for (let i = 0; i < vehicle.wheelInfos.length; i++) {
                vehicle.updateWheelTransform(i);
                const transform = vehicle.wheelInfos[i].worldTransform;
                wheelMeshes[i].position.copy(transform.position);
                wheelMeshes[i].quaternion.copy(transform.quaternion);
                // 找到最低轮子位置
                const wheelBottomY = transform.position.y - vehicleConfig.wheelRadius;
                if (wheelBottomY < lowestWheelY) {
                    lowestWheelY = wheelBottomY;
                }
            }
            
            // Ferrari模型Y偏移（固定值，让轮子贴地）
            if (carModel) {
                carModel.position.y = -0.75;
            }
            
            // 更新Ferrari模型的轮子旋转
            if (ferrariWheels.length > 0) {
                // 计算车速
                const velocity = chassisBody.velocity;
                const speed = Math.sqrt(velocity.x * velocity.x + velocity.z * velocity.z);
                
                // 轮子旋转速度（根据车速）
                const wheelRotationSpeed = speed * deltaTime * 3;
                
                // 获取前轮转向角度
                const steerAngle = currentSteerVal;
                
                ferrariWheels.forEach((wheel, index) => {
                    // 根据车辆前进方向决定旋转方向
                    const forward = new THREE.Vector3(0, 0, 1);
                    forward.applyQuaternion(chassisBody.quaternion);
                    const dot = velocity.x * forward.x + velocity.z * forward.z;
                    const direction = dot >= 0 ? 1 : -1;
                    
                    // 轮子绕X轴旋转（滚动）
                    wheel.rotation.x += wheelRotationSpeed * direction;
                    
                    // 前轮转向（通常前两个是前轮）
                    const wheelName = wheel.name.toLowerCase();
                    if (wheelName.includes('front') || wheelName.includes('fl') || wheelName.includes('fr')) {
                        wheel.rotation.y = steerAngle;
                    }
                });
            }

            // 树木碰撞检测和晃动效果
            const carX = chassisBody.position.x;
            const carZ = chassisBody.position.z;
            const carSpeed = Math.sqrt(chassisBody.velocity.x ** 2 + chassisBody.velocity.z ** 2);
            const currentTime = Date.now();
            
            trees.forEach(tree => {
                // 检测碰撞（增大检测半径，因为物理引擎会阻止车辆靠近）
                const dx = carX - tree.x;
                const dz = carZ - tree.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                // 检测半径 = 树干半径 + 车身宽度，速度阈值降低
                if (dist < 3.5 && carSpeed > 1 && currentTime - lastCollisionTime > 300) {
                    // 触发碰撞
                    tree.shakeTime = 1.0;
                    lastCollisionTime = currentTime;
                    
                    // 播放撞击音效
                    const intensity = Math.min(carSpeed / 8, 1);
                    playCollisionSound(intensity);
                    console.log('💥 撞击树木！速度:', carSpeed.toFixed(1), '距离:', dist.toFixed(1));
                }
                
                // 更新晃动效果
                if (tree.shakeTime > 0) {
                    tree.shakeTime -= deltaTime * 2;
                    const shake = Math.sin(tree.shakeTime * 30) * tree.shakeTime * 0.15;
                    tree.group.rotation.x = shake;
                    tree.group.rotation.z = shake * 0.7;
                } else {
                    // 恢复原位
                    tree.group.rotation.x *= 0.9;
                    tree.group.rotation.z *= 0.9;
                }
            });

            // 金属底座碰撞检测
            metalBases.forEach(base => {
                const dx = carX - base.x;
                const dz = carZ - base.z;
                const dist = Math.sqrt(dx * dx + dz * dz);
                
                if (dist < base.radius && carSpeed > 1 && currentTime - lastMetalCollisionTime > 300) {
                    lastMetalCollisionTime = currentTime;
                    const intensity = Math.min(carSpeed / 6, 1);
                    playMetalCollisionSound(intensity);
                    console.log('🔩 撞击金属底座！速度:', carSpeed.toFixed(1));
                }
            });

            // 更新相机
            updateCamera();

            // 更新速度显示
            updateSpeedDisplay();

            // 更新音效
            const velocity = chassisBody.velocity;
            const speed = Math.sqrt(velocity.x * velocity.x + velocity.z * velocity.z);
            updateEngineSound(speed, controls.forward, controls.backward, controls.brake);

            // 更新鱼的游动
            fishes.forEach(fish => {
                // 随机转向
                fish.angle += (Math.random() - 0.5) * fish.turnSpeed * deltaTime;
                
                // 计算新位置
                const localX = fish.mesh.position.x + Math.cos(fish.angle) * fish.speed * deltaTime;
                const localZ = fish.mesh.position.z + Math.sin(fish.angle) * fish.speed * deltaTime;
                
                // 检查是否超出湖泊范围
                const dist = Math.sqrt(localX * localX + localZ * localZ);
                if (dist > fish.lakeRadius) {
                    // 转向朝向湖中心
                    fish.angle = Math.atan2(-localZ, -localX) + (Math.random() - 0.5) * 0.5;
                } else {
                    fish.mesh.position.x = localX;
                    fish.mesh.position.z = localZ;
                }
                
                // 鱼朝向移动方向
                fish.mesh.rotation.y = -fish.angle + Math.PI / 2;
                
                // 鱼尾摆动
                fish.tailWag += deltaTime * 10;
                fish.mesh.rotation.z = Math.sin(fish.tailWag) * 0.1;
            });

            // 云朵慢速飘动
            if (cloudsGroup && cloudsGroup.visible) {
                cloudsGroup.children.forEach((cloud, i) => {
                    // 每朵云有不同的速度
                    const speed = 2 + (i % 3);
                    cloud.position.x += speed * deltaTime;
                    
                    // 超出范围后循环
                    if (cloud.position.x > 300) {
                        cloud.position.x = -300;
                    }
                });
            }

            // 更新天气
            updateWeather(deltaTime);

            // 渲染
            renderer.render(scene, camera);
        }

        // ============================================
        // 启动应用
        // ============================================
        init();
    </script>
</body>
</html>
