            buildingGroup.position.set(x, 0, z);

            // 建筑类型随机
            const buildingType = Math.random();
            
            // 现代玻璃幕墙大楼
            if (buildingType > 0.5) {
                createModernBuilding(buildingGroup, width, height, depth);
            } else {
                createClassicBuilding(buildingGroup, width, height, depth);
            }

            scene.add(buildingGroup);

            // 物理体
            const shape = new CANNON.Box(new CANNON.Vec3(width / 2, height / 2, depth / 2));
            const body = new CANNON.Body({
                mass: 0,
                position: new CANNON.Vec3(x, height / 2, z)
            });
            body.addShape(shape);
            world.addBody(body);
        }

        // 现代玻璃幕墙建筑
        function createModernBuilding(group, width, height, depth) {
            // 主体 - 玻璃幕墙
            const glassMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x88ccff,
                metalness: 0.9,
                roughness: 0.1,
                transmission: 0.3,
                thickness: 0.5,
                envMapIntensity: 2.0
            });
            
            const frameMaterial = new THREE.MeshStandardMaterial({
                color: 0x333333,
                metalness: 0.8,
                roughness: 0.2
            });

            // 主体
            const mainGeo = new THREE.BoxGeometry(width - 0.2, height, depth - 0.2);
            const main = new THREE.Mesh(mainGeo, glassMaterial);
            main.position.y = height / 2;
            main.castShadow = true;
            main.receiveShadow = true;
            group.add(main);

            // 楼层分隔线
            const floorHeight = 3.5;
            for (let y = floorHeight; y < height; y += floorHeight) {
                const lineGeo = new THREE.BoxGeometry(width + 0.1, 0.15, depth + 0.1);
                const line = new THREE.Mesh(lineGeo, frameMaterial);
                line.position.y = y;
                group.add(line);
            }

            // 垂直框架
            const framePositions = [
                [-width/2, depth/2], [width/2, depth/2],
                [-width/2, -depth/2], [width/2, -depth/2]
            ];
            framePositions.forEach(([fx, fz]) => {
                const frameGeo = new THREE.BoxGeometry(0.3, height, 0.3);
                const frame = new THREE.Mesh(frameGeo, frameMaterial);
                frame.position.set(fx, height/2, fz);
                group.add(frame);
            });

            // 屋顶设备
            const roofEquipGeo = new THREE.BoxGeometry(width * 0.3, 2, depth * 0.3);
            const roofEquip = new THREE.Mesh(roofEquipGeo, frameMaterial);
            roofEquip.position.y = height + 1;
            group.add(roofEquip);

            // 天线
            const antennaGeo = new THREE.CylinderGeometry(0.1, 0.1, 5, 8);
            const antenna = new THREE.Mesh(antennaGeo, frameMaterial);
            antenna.position.y = height + 4.5;
            group.add(antenna);

            // 发光窗户
            addGlowingWindows(group, width, height, depth, floorHeight);
        }

        // 经典砖墙建筑
        function createClassicBuilding(group, width, height, depth) {
            const colors = [0xb85c38, 0x8b4513, 0xa0522d, 0xcd853f];
            const brickColor = colors[Math.floor(Math.random() * colors.length)];

            const brickMaterial = new THREE.MeshStandardMaterial({
                color: brickColor,
                roughness: 0.9,
                metalness: 0.1
            });

            const concreteMaterial = new THREE.MeshStandardMaterial({
                color: 0xcccccc,
                roughness: 0.8
            });

            // 主体
            const mainGeo = new THREE.BoxGeometry(width, height, depth);
            const main = new THREE.Mesh(mainGeo, brickMaterial);
            main.position.y = height / 2;
            main.castShadow = true;
            main.receiveShadow = true;
            group.add(main);

            // 底座
            const baseGeo = new THREE.BoxGeometry(width + 0.5, 1.5, depth + 0.5);
            const base = new THREE.Mesh(baseGeo, concreteMaterial);
            base.position.y = 0.75;
            group.add(base);

            // 顶部装饰
            const topGeo = new THREE.BoxGeometry(width + 0.3, 0.8, depth + 0.3);
            const top = new THREE.Mesh(topGeo, concreteMaterial);
            top.position.y = height + 0.4;
            group.add(top);

            // 窗户
            addDetailedWindows(group, width, height, depth);

            // 阳台（随机添加）
            if (Math.random() > 0.5) {
                addBalconies(group, width, height, depth);
            }

            // 空调外机
            addACUnits(group, width, height, depth);
        }

        // 发光窗户（现代建筑）
        function addGlowingWindows(group, width, height, depth, floorHeight) {
            const windowMat = new THREE.MeshStandardMaterial({
                color: 0xffffee,
                emissive: 0xffffaa,
                emissiveIntensity: Math.random() * 0.5 + 0.2
            });

            for (let y = floorHeight/2; y < height - 1; y += floorHeight) {
                for (let wx = -width/2 + 1.5; wx < width/2 - 1; wx += 2.5) {
                    if (Math.random() > 0.3) {
                        const winGeo = new THREE.PlaneGeometry(1.5, 2);
                        const win = new THREE.Mesh(winGeo, windowMat.clone());
                        win.position.set(wx, y, depth/2 + 0.02);
                        group.add(win);
                    }
                }
            }
        }

        // 详细窗户（经典建筑）
        function addDetailedWindows(group, width, height, depth) {
            const windowFrameMat = new THREE.MeshStandardMaterial({ color: 0xffffff, roughness: 0.5 });
            const glassMat = new THREE.MeshStandardMaterial({
                color: 0x88aacc,
                emissive: 0xffffcc,
                emissiveIntensity: Math.random() * 0.3,
                metalness: 0.5,
                roughness: 0.2
            });

            const floorHeight = 3.5;
            for (let y = 2.5; y < height - 1; y += floorHeight) {
                for (let wx = -width/2 + 2; wx < width/2 - 1; wx += 3) {
                    // 窗框
                    const frameGeo = new THREE.BoxGeometry(1.4, 2.2, 0.15);
                    const frame = new THREE.Mesh(frameGeo, windowFrameMat);
                    frame.position.set(wx, y, depth/2 + 0.08);
                    group.add(frame);

                    // 玻璃
                    const glassGeo = new THREE.PlaneGeometry(1.2, 2);
                    const glass = new THREE.Mesh(glassGeo, glassMat.clone());
                    glass.position.set(wx, y, depth/2 + 0.16);
                    group.add(glass);
                }
            }
        }

        // 阳台
        function addBalconies(group, width, height, depth) {
            const balconyMat = new THREE.MeshStandardMaterial({ color: 0x888888, roughness: 0.7 });
            const railMat = new THREE.MeshStandardMaterial({ color: 0x333333, metalness: 0.8 });

            const floorHeight = 3.5;
            for (let y = floorHeight; y < height - 2; y += floorHeight * 2) {
                // 阳台地板
                const floorGeo = new THREE.BoxGeometry(2.5, 0.15, 1.2);
                const floor = new THREE.Mesh(floorGeo, balconyMat);
                floor.position.set(0, y, depth/2 + 0.6);
                group.add(floor);

                // 栏杆
                const railGeo = new THREE.BoxGeometry(2.5, 1, 0.05);
                const rail = new THREE.Mesh(railGeo, railMat);
                rail.position.set(0, y + 0.5, depth/2 + 1.15);
                group.add(rail);
            }
        }

        // 空调外机
        function addACUnits(group, width, height, depth) {
            const acMat = new THREE.MeshStandardMaterial({ color: 0xeeeeee, roughness: 0.6 });

            for (let i = 0; i < 3; i++) {
                if (Math.random() > 0.5) {
                    const acGeo = new THREE.BoxGeometry(0.8, 0.6, 0.4);
                    const ac = new THREE.Mesh(acGeo, acMat);
                    const yPos = 5 + i * 7 + Math.random() * 3;
                    if (yPos < height - 2) {
                        ac.position.set(-width/2 - 0.2, yPos, (Math.random() - 0.5) * depth * 0.6);
                        group.add(ac);
                    }
                }
            }
        }

        // 给建筑添加窗户（保留兼容性）
        function addWindowsToBuilding(building, width, height, depth) {
            const windowGeometry = new THREE.PlaneGeometry(1, 1.5);
            const windowMaterial = new THREE.MeshStandardMaterial({
                color: 0xffffcc,
                emissive: 0xffffcc,
                emissiveIntensity: Math.random() * 0.3,
                side: THREE.DoubleSide
            });

            const windowSpacingH = 3;
            const windowSpacingV = 4;

            // 前后面窗户
            for (let y = 2; y < height - 2; y += windowSpacingV) {
                for (let wx = -width / 2 + 2; wx < width / 2 - 1; wx += windowSpacingH) {
                    // 前面
                    const frontWindow = new THREE.Mesh(windowGeometry, windowMaterial.clone());
                    frontWindow.position.set(wx, y - height / 2, depth / 2 + 0.01);
                    building.add(frontWindow);

                    // 后面
                    const backWindow = new THREE.Mesh(windowGeometry, windowMaterial.clone());
                    backWindow.position.set(wx, y - height / 2, -depth / 2 - 0.01);
                    backWindow.rotation.y = Math.PI;
                    building.add(backWindow);
                }
            }

            // 左右面窗户
            for (let y = 2; y < height - 2; y += windowSpacingV) {
                for (let wz = -depth / 2 + 2; wz < depth / 2 - 1; wz += windowSpacingH) {
                    // 左面
                    const leftWindow = new THREE.Mesh(windowGeometry, windowMaterial.clone());
                    leftWindow.position.set(-width / 2 - 0.01, y - height / 2, wz);
                    leftWindow.rotation.y = -Math.PI / 2;
                    building.add(leftWindow);

                    // 右面
                    const rightWindow = new THREE.Mesh(windowGeometry, windowMaterial.clone());
                    rightWindow.position.set(width / 2 + 0.01, y - height / 2, wz);
                    rightWindow.rotation.y = Math.PI / 2;
                    building.add(rightWindow);
                }
            }
        }

        // 创建广告牌
        function createBillboard(x, z) {
            const poleHeight = 8;
            const poleRadius = 0.2;
            const boardWidth = 6;
            const boardHeight = 3;

            // 广告牌组
            const billboardGroup = new THREE.Group();
            billboardGroup.position.set(x, 0, z);

            // 杆子
            const poleGeometry = new THREE.CylinderGeometry(poleRadius, poleRadius, poleHeight, 8);
            const poleMaterial = new THREE.MeshStandardMaterial({
                color: 0x666666,
                metalness: 0.8,
                roughness: 0.3
            });
            const poleMesh = new THREE.Mesh(poleGeometry, poleMaterial);
            poleMesh.position.y = poleHeight / 2;
            poleMesh.castShadow = true;
            billboardGroup.add(poleMesh);

            // 广告板
            const boardGeometry = new THREE.BoxGeometry(boardWidth, boardHeight, 0.3);
            const boardColors = [0xe91e63, 0x2196f3, 0xff9800, 0x4caf50, 0x9c27b0];
            const boardMaterial = new THREE.MeshStandardMaterial({
                color: boardColors[Math.floor(Math.random() * boardColors.length)],
                roughness: 0.5,
                metalness: 0.2
            });
            const boardMesh = new THREE.Mesh(boardGeometry, boardMaterial);
            boardMesh.position.y = poleHeight + boardHeight / 2;
            boardMesh.castShadow = true;
            billboardGroup.add(boardMesh);

            scene.add(billboardGroup);

            // 杆子物理体
            const poleShape = new CANNON.Cylinder(poleRadius, poleRadius, poleHeight, 8);
            const poleBody = new CANNON.Body({
                mass: 0,
                position: new CANNON.Vec3(x, poleHeight / 2, z)
            });
            poleBody.addShape(poleShape);
            world.addBody(poleBody);
        }

        // 创建精细树木
        function createTree(x, z) {
            const treeType = Math.random();
            const treeGroup = new THREE.Group();
            treeGroup.position.set(x, 0, z);

            const trunkMat = new THREE.MeshStandardMaterial({
                color: 0x5d4037,
                roughness: 0.9
            });

            if (treeType > 0.5) {
                // 圆形阔叶树
                const trunkHeight = 4 + Math.random() * 3;
                const trunkRadius = 0.25 + Math.random() * 0.15;

                // 树干
                const trunkGeo = new THREE.CylinderGeometry(trunkRadius * 0.6, trunkRadius, trunkHeight, 8);
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = trunkHeight / 2;
                trunk.castShadow = true;
                treeGroup.add(trunk);

                // 多层球形树冠
                const leafColors = [0x228b22, 0x2e8b57, 0x32cd32, 0x3cb371];
                const leafMat = new THREE.MeshStandardMaterial({
                    color: leafColors[Math.floor(Math.random() * leafColors.length)],
                    roughness: 0.8
                });

                const crownRadius = 2 + Math.random() * 1.5;
                // 主树冠
                const mainCrownGeo = new THREE.SphereGeometry(crownRadius, 12, 12);
                const mainCrown = new THREE.Mesh(mainCrownGeo, leafMat);
                mainCrown.position.y = trunkHeight + crownRadius * 0.6;
                mainCrown.castShadow = true;
                treeGroup.add(mainCrown);

                // 副树冠
                for (let i = 0; i < 3; i++) {
                    const subRadius = crownRadius * (0.5 + Math.random() * 0.3);
                    const subGeo = new THREE.SphereGeometry(subRadius, 8, 8);
                    const sub = new THREE.Mesh(subGeo, leafMat);
                    const angle = (i / 3) * Math.PI * 2 + Math.random() * 0.5;
                    sub.position.set(
                        Math.cos(angle) * crownRadius * 0.5,
                        trunkHeight + crownRadius * 0.3 + Math.random(),
                        Math.sin(angle) * crownRadius * 0.5
                    );
                    sub.castShadow = true;
                    treeGroup.add(sub);
                }

                // 物理体
                const shape = new CANNON.Cylinder(trunkRadius * 0.6, trunkRadius, trunkHeight, 8);
                const body = new CANNON.Body({ mass: 0, position: new CANNON.Vec3(x, trunkHeight / 2, z) });
                body.addShape(shape);
                world.addBody(body);

            } else {
                // 松树/针叶树
                const trunkHeight = 5 + Math.random() * 4;
                const trunkRadius = 0.2 + Math.random() * 0.1;

                // 树干
                const trunkGeo = new THREE.CylinderGeometry(trunkRadius * 0.5, trunkRadius, trunkHeight, 8);
                const trunk = new THREE.Mesh(trunkGeo, trunkMat);
                trunk.position.y = trunkHeight / 2;
                trunk.castShadow = true;
                treeGroup.add(trunk);

                // 多层锥形树冠
                const leafMat = new THREE.MeshStandardMaterial({
                    color: 0x1b5e20,
                    roughness: 0.85
                });

                const layers = 3 + Math.floor(Math.random() * 2);
                for (let i = 0; i < layers; i++) {
                    const layerY = trunkHeight * 0.4 + i * 1.8;
                    const layerRadius = 2 - i * 0.4 + Math.random() * 0.3;
                    const layerHeight = 2.5 - i * 0.3;

                    const coneGeo = new THREE.ConeGeometry(layerRadius, layerHeight, 8);
                    const cone = new THREE.Mesh(coneGeo, leafMat);
                    cone.position.y = layerY;
                    cone.castShadow = true;
                    treeGroup.add(cone);
                }

                // 物理体
                const shape = new CANNON.Cylinder(trunkRadius * 0.5, trunkRadius, trunkHeight, 8);
                const body = new CANNON.Body({ mass: 0, position: new CANNON.Vec3(x, trunkHeight / 2, z) });
                body.addShape(shape);
                world.addBody(body);
            }

            scene.add(treeGroup);
            
            // 存储树木信息用于碰撞检测
            trees.push({
                group: treeGroup,
                x: x,
                z: z,
                radius: 1.5, // 碰撞半径
                shakeTime: 0,
                originalRotation: { x: 0, z: 0 }
            });
        }

        // 创建精细湖泊
        function createLake(x, z) {
            const lakeRadius = 12 + Math.random() * 12;
            const segments = 64;
            const lakeGroup = new THREE.Group();
            lakeGroup.position.set(x, 0, z);

            // 湖底（深色）
            const bottomGeo = new THREE.CircleGeometry(lakeRadius - 0.5, segments);
            const bottomMat = new THREE.MeshStandardMaterial({
                color: 0x0d3b66,
                roughness: 0.9
            });
            const bottom = new THREE.Mesh(bottomGeo, bottomMat);
            bottom.rotation.x = -Math.PI / 2;
            bottom.position.y = -0.3;
            lakeGroup.add(bottom);

            // 湖面（带反射的水）
            const waterMaterial = new THREE.MeshPhysicalMaterial({
                color: 0x0077be,
                metalness: 0.1,
                roughness: 0.05,
                transmission: 0.6,
                thickness: 1.5,
                ior: 1.33,
                transparent: true,
                opacity: 0.85,
                envMapIntensity: 1.5
            });
            const waterGeo = new THREE.CircleGeometry(lakeRadius, segments);
            const water = new THREE.Mesh(waterGeo, waterMaterial);
            water.rotation.x = -Math.PI / 2;
            water.position.y = 0.05;
            water.receiveShadow = true;
            lakeGroup.add(water);

            // 沙滩环
            const sandGeo = new THREE.RingGeometry(lakeRadius, lakeRadius + 2, segments);
            const sandMat = new THREE.MeshStandardMaterial({
                color: 0xf4d03f,
                roughness: 0.95
            });
            const sand = new THREE.Mesh(sandGeo, sandMat);
            sand.rotation.x = -Math.PI / 2;
            sand.position.y = 0.02;
            lakeGroup.add(sand);

            // 草地边缘
            const grassGeo = new THREE.RingGeometry(lakeRadius + 2, lakeRadius + 4, segments);
            const grassMat = new THREE.MeshStandardMaterial({
                color: 0x228b22,
                roughness: 0.9
            });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2;
            grass.position.y = 0.03;
            lakeGroup.add(grass);

            // 添加岸边石头
            for (let i = 0; i < 12; i++) {
                const angle = (i / 12) * Math.PI * 2 + Math.random() * 0.3;
                const dist = lakeRadius + 0.5 + Math.random() * 1.5;
                const rockSize = 0.3 + Math.random() * 0.5;
                
                const rockGeo = new THREE.DodecahedronGeometry(rockSize, 0);
                const rockMat = new THREE.MeshStandardMaterial({
                    color: 0x696969,
                    roughness: 0.9,
                    flatShading: true
                });
                const rock = new THREE.Mesh(rockGeo, rockMat);
                rock.position.set(
                    Math.cos(angle) * dist,
                    rockSize * 0.3,
                    Math.sin(angle) * dist
                );
                rock.rotation.set(Math.random(), Math.random(), Math.random());
                rock.castShadow = true;
                lakeGroup.add(rock);
            }

            // 添加芦苇
            for (let i = 0; i < 20; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = lakeRadius - 1 + Math.random() * 2;
                createReed(lakeGroup, Math.cos(angle) * dist, Math.sin(angle) * dist);
            }

            // 添加睡莲
            for (let i = 0; i < 5; i++) {
                const angle = Math.random() * Math.PI * 2;
                const dist = Math.random() * (lakeRadius - 3);
                createWaterLily(lakeGroup, Math.cos(angle) * dist, Math.sin(angle) * dist);
            }

            // 添加游动的鱼
            const fishColors = [0xff0000, 0xff4500, 0xffff00, 0x00ff00, 0x0080ff, 0xff00ff, 0xff1493, 0x00ffff];
            const fishCount = 15 + Math.floor(Math.random() * 10);
            
            for (let i = 0; i < fishCount; i++) {
                const fishGroup = new THREE.Group();
                const color = fishColors[Math.floor(Math.random() * fishColors.length)];
                
                // 鱼身（椭圆形）
                const bodyGeo = new THREE.SphereGeometry(0.15, 8, 6);
                bodyGeo.scale(1.8, 0.8, 1);
                const bodyMat = new THREE.MeshStandardMaterial({
                    color: color,
                    metalness: 0.1,
                    roughness: 0.2,
                    emissive: color,
                    emissiveIntensity: 0.3
                });
                const body = new THREE.Mesh(bodyGeo, bodyMat);
                fishGroup.add(body);
                
                // 鱼尾
                const tailGeo = new THREE.ConeGeometry(0.1, 0.2, 4);
                tailGeo.rotateZ(Math.PI / 2);
                const tail = new THREE.Mesh(tailGeo, bodyMat);
                tail.position.x = -0.25;
                fishGroup.add(tail);
                
                // 鱼鳍
                const finGeo = new THREE.ConeGeometry(0.05, 0.12, 3);
                finGeo.rotateX(Math.PI / 2);
                const topFin = new THREE.Mesh(finGeo, bodyMat);
                topFin.position.set(0, 0.1, 0);
                fishGroup.add(topFin);
                
                // 随机初始位置
                const initAngle = Math.random() * Math.PI * 2;
                const initDist = Math.random() * (lakeRadius - 2);
                fishGroup.position.set(
                    Math.cos(initAngle) * initDist,
                    -0.1,
                    Math.sin(initAngle) * initDist
                );
                fishGroup.rotation.y = Math.random() * Math.PI * 2;
                
                lakeGroup.add(fishGroup);
                
                // 存储鱼的信息用于动画
                fishes.push({
                    mesh: fishGroup,
                    lakeX: x,
                    lakeZ: z,
                    lakeRadius: lakeRadius - 2,
                    speed: 0.3 + Math.random() * 0.4,
                    turnSpeed: 0.5 + Math.random() * 1,
                    angle: Math.random() * Math.PI * 2,
                    tailWag: 0
                });
            }

            scene.add(lakeGroup);

            // 湖泊边界物理体（不可见的墙）
            const wallHeight = 3;
            const wallThickness = 0.5;
            const numWalls = 16;

            for (let i = 0; i < numWalls; i++) {
                const angle = (i / numWalls) * Math.PI * 2;
                const nextAngle = ((i + 1) / numWalls) * Math.PI * 2;
                
                const midAngle = (angle + nextAngle) / 2;
                const wallLength = 2 * lakeRadius * Math.sin(Math.PI / numWalls);
                
                const wallX = x + Math.cos(midAngle) * lakeRadius;
                const wallZ = z + Math.sin(midAngle) * lakeRadius;

                const wallShape = new CANNON.Box(new CANNON.Vec3(
                    wallLength / 2,
                    wallHeight / 2,
                    wallThickness / 2
                ));
                const wallBody = new CANNON.Body({
                    mass: 0,
                    position: new CANNON.Vec3(wallX, wallHeight / 2, wallZ)
                });
                wallBody.quaternion.setFromEuler(0, -midAngle + Math.PI / 2, 0);
                wallBody.addShape(wallShape);
                world.addBody(wallBody);
            }
        }

        // 创建芦苇
        function createReed(group, localX, localZ) {
            const reedGroup = new THREE.Group();
            reedGroup.position.set(localX, 0.1, localZ);

            const reedMat = new THREE.MeshStandardMaterial({
                color: 0x6b8e23,
                roughness: 0.8,
                side: THREE.DoubleSide
            });

            // 多根芦苇
            for (let i = 0; i < 3; i++) {
                const height = 1 + Math.random() * 1.5;
                const reedGeo = new THREE.CylinderGeometry(0.02, 0.04, height, 6);
                const reed = new THREE.Mesh(reedGeo, reedMat);
                reed.position.set(
                    (Math.random() - 0.5) * 0.3,
                    height / 2,
                    (Math.random() - 0.5) * 0.3
                );
                reed.rotation.x = (Math.random() - 0.5) * 0.2;
                reed.rotation.z = (Math.random() - 0.5) * 0.2;
                reedGroup.add(reed);

                // 芦苇穗
                const topGeo = new THREE.CylinderGeometry(0.03, 0.01, 0.3, 6);
                const topMat = new THREE.MeshStandardMaterial({ color: 0xdaa520 });
                const top = new THREE.Mesh(topGeo, topMat);
                top.position.copy(reed.position);
                top.position.y += height / 2 + 0.15;
                reedGroup.add(top);
            }

            group.add(reedGroup);
        }

        // 创建睡莲
        function createWaterLily(group, localX, localZ) {
            const lilyGroup = new THREE.Group();
            lilyGroup.position.set(localX, 0.08, localZ);

            // 荷叶
            const leafGeo = new THREE.CircleGeometry(0.5, 16);
            const leafMat = new THREE.MeshStandardMaterial({
                color: 0x228b22,
                roughness: 0.7,
                side: THREE.DoubleSide
            });
            const leaf = new THREE.Mesh(leafGeo, leafMat);

        // 天空穹顶

        function addSkyDome() {
            // 简单的渐变天空
            const skyGeometry = new THREE.SphereGeometry(400, 32, 32);
            const skyMaterial = new THREE.ShaderMaterial({
                uniforms: {
                    topColor: { value: new THREE.Color(0x0077ff) },
                    bottomColor: { value: new THREE.Color(0xffffff) },
                    offset: { value: 33 },
                    exponent: { value: 0.6 }
                },
                vertexShader: `
                    varying vec3 vWorldPosition;
                    void main() {
                        vec4 worldPosition = modelMatrix * vec4(position, 1.0);
                        vWorldPosition = worldPosition.xyz;
                        gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
                    }
                `,
                fragmentShader: `
                    uniform vec3 topColor;
                    uniform vec3 bottomColor;
                    uniform float offset;
                    uniform float exponent;
                    varying vec3 vWorldPosition;
                    void main() {
                        float h = normalize(vWorldPosition + offset).y;
                        gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h, 0.0), exponent), 0.0)), 1.0);
                    }
                `,
                side: THREE.BackSide
            });
            const sky = new THREE.Mesh(skyGeometry, skyMaterial);
            sky.name = 'sky';
            scene.add(sky);
        }

        // ============================================
        // 音效系统
        // ============================================
        function initAudioSystem() {
            if (audioInitialized) return;
            
            // 创建音频上下文（需要用户交互）
            audioContext = new (window.AudioContext || window.webkitAudioContext)();
            
            // 确保音频上下文已启动
            if (audioContext.state === 'suspended') {
                audioContext.resume();
            }
            
            // 引擎音效（使用振荡器模拟）
            engineOscillator = audioContext.createOscillator();
            engineGain = audioContext.createGain();
            
            // 创建更丰富的引擎声音
            const engineOsc2 = audioContext.createOscillator();
            const engineGain2 = audioContext.createGain();
            
            engineOscillator.type = 'sawtooth';
            engineOscillator.frequency.setValueAtTime(60, audioContext.currentTime);
            engineGain.gain.setValueAtTime(0, audioContext.currentTime);
            
            engineOsc2.type = 'square';
            engineOsc2.frequency.setValueAtTime(30, audioContext.currentTime);
            engineGain2.gain.setValueAtTime(0, audioContext.currentTime);
            
            // 低通滤波器使声音更像引擎
            const filter = audioContext.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(800, audioContext.currentTime);
            
            engineOscillator.connect(engineGain);
            engineOsc2.connect(engineGain2);
            engineGain.connect(filter);
            engineGain2.connect(filter);
            filter.connect(audioContext.destination);
            
            engineOscillator.start();
            engineOsc2.start();
            
            sounds.engine = { osc1: engineOscillator, osc2: engineOsc2, gain1: engineGain, gain2: engineGain2, filter };
            
            audioInitialized = true;
            console.log('🔊 音效系统已初始化');
        }

        function updateEngineSound(speed, isAccelerating, isReversing, isBraking) {
            if (!sounds.engine || !audioContext) return;
            
            const { osc1, osc2, gain1, gain2 } = sounds.engine;
            const currentTime = audioContext.currentTime;
            
            // 基础引擎音量
            let targetVolume = 0;
            let baseFreq = 50;
            
            if (isAccelerating) {
                // 加速时
                targetVolume = 0.12 + speed * 0.003;
                baseFreq = 80 + speed * 4;
            } else if (isReversing && speed > 0.3) {
                // 倒车
                targetVolume = 0.1;
                baseFreq = 60 + speed * 3;
            } else if (isBraking && speed > 2) {
                // 刹车
                targetVolume = 0.08;
                baseFreq = 50;
            } else if (speed > 1) {
                // 滑行
                targetVolume = 0.05 + speed * 0.002;
                baseFreq = 60 + speed * 2;
            }
            // 停止时无声音（targetVolume = 0）
            
            // 限制范围
            targetVolume = Math.min(targetVolume, 0.2);
            baseFreq = Math.min(baseFreq, 200);
            
            // 平滑过渡
            gain1.gain.linearRampToValueAtTime(targetVolume, currentTime + 0.1);
            gain2.gain.linearRampToValueAtTime(targetVolume * 0.5, currentTime + 0.1);
            osc1.frequency.linearRampToValueAtTime(baseFreq, currentTime + 0.1);
            osc2.frequency.linearRampToValueAtTime(baseFreq * 0.5, currentTime + 0.1);
        }

        function playBrakeSound() {
            if (!audioContext) return;
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(200, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioContext.currentTime + 0.3);
            
            gain.gain.setValueAtTime(0.05, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.3);
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            
            osc.start();
            osc.stop(audioContext.currentTime + 0.3);
        }

        // 急刹车轮胎摩擦音效
        function playBrakingSound() {
            if (!audioContext || isBrakingSoundPlaying) return;
            
            isBrakingSoundPlaying = true;
            
            // 创建白噪音模拟轮胎摩擦
            const bufferSize = audioContext.sampleRate * 1.5;
            const buffer = audioContext.createBuffer(1, bufferSize, audioContext.sampleRate);
            const data = buffer.getChannelData(0);
            
            for (let i = 0; i < bufferSize; i++) {
                const t = i / audioContext.sampleRate;
                // 衰减的噪音
                const envelope = Math.exp(-t * 1.5);
                // 白噪音 + 轻微频率调制
                const noise = (Math.random() * 2 - 1) * 0.6;
                const squeal = Math.sin(t * 2000 + Math.sin(t * 50) * 100) * 0.3;
                data[i] = (noise + squeal) * envelope;
            }
            
            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            
            // 高通滤波器让声音更尖锐
            const highpass = audioContext.createBiquadFilter();
            highpass.type = 'highpass';
            highpass.frequency.setValueAtTime(800, audioContext.currentTime);
            
            // 音量控制
            const gainNode = audioContext.createGain();
            gainNode.gain.setValueAtTime(0.15, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 1.2);
            
            source.connect(highpass);
            highpass.connect(gainNode);
            gainNode.connect(audioContext.destination);
            
            source.start();
            source.onended = () => {
                isBrakingSoundPlaying = false;
            };
            
            // 确保状态重置
            setTimeout(() => {
                isBrakingSoundPlaying = false;
            }, 1500);
        }

        // 撞击音效
        function playCollisionSound(intensity = 1) {
            if (!audioContext) return;
            
            // 低频撞击声
            const osc = audioContext.createOscillator();
            const gain = audioContext.createGain();
            
            osc.type = 'sine';
            osc.frequency.setValueAtTime(80, audioContext.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioContext.currentTime + 0.15);
            
            gain.gain.setValueAtTime(1.6 * intensity, audioContext.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);
            
            osc.connect(gain);
            gain.connect(audioContext.destination);
            osc.start();
            osc.stop(audioContext.currentTime + 0.2);
            
            // 金属碰撞声
            const noise = audioContext.createOscillator();
            const noiseGain = audioContext.createGain();
            const filter = audioContext.createBiquadFilter();
            
            noise.type = 'sawtooth';
            noise.frequency.setValueAtTime(200 + Math.random() * 100, audioContext.currentTime);
            
            filter.type = 'bandpass';
            filter.frequency.setValueAtTime(800, audioContext.currentTime);
            filter.Q.setValueAtTime(5, audioContext.currentTime);
            
            noiseGain.gain.setValueAtTime(1.0 * intensity, audioContext.currentTime);
            noiseGain.gain.exponentialRampToValueAtTime(0.001, audioContext.currentTime + 0.1);
            
            noise.connect(filter);
            filter.connect(noiseGain);
            noiseGain.connect(audioContext.destination);
            noise.start();
            noise.stop(audioContext.currentTime + 0.15);
        }

        // 金属撞击音效（撞击底座时使用）
        function playMetalCollisionSound(intensity = 1) {
            if (!audioContext) return;
            
            // 金属撞击的主音（高频金属声）

        // 创建雪花纹理
        function createSnowflakeTexture() {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');
            
            ctx.fillStyle = 'transparent';
            ctx.fillRect(0, 0, 64, 64);
            
            ctx.strokeStyle = '#ffffff';
            ctx.lineWidth = 2;
            ctx.lineCap = 'round';
            
            const cx = 32, cy = 32;
            
            // 绘制六角雪花
            for (let i = 0; i < 6; i++) {
                const angle = (i / 6) * Math.PI * 2;
                ctx.save();
                ctx.translate(cx, cy);
                ctx.rotate(angle);
                
                // 主枝
                ctx.beginPath();
                ctx.moveTo(0, 0);
                ctx.lineTo(0, -26);
                ctx.stroke();
                
                // 小分叉
                ctx.beginPath();
                ctx.moveTo(0, -10);
                ctx.lineTo(-6, -16);
                ctx.moveTo(0, -10);
                ctx.lineTo(6, -16);
                ctx.stroke();
                
                ctx.beginPath();
                ctx.moveTo(0, -18);
                ctx.lineTo(-4, -22);
                ctx.moveTo(0, -18);
                ctx.lineTo(4, -22);
                ctx.stroke();
                
                ctx.restore();
            }
            
            const texture = new THREE.CanvasTexture(canvas);
            return texture;
        }
        
        // 重置粒子到车辆周围

            const carPos = chassisBody ? { x: chassisBody.position.x, z: chassisBody.position.z } : { x: 0, z: 0 };

        // 创建天体

            const sunGeo = new THREE.SphereGeometry(15, 32, 32);
            const sunMat = new THREE.MeshBasicMaterial({ color: 0xffdd00 });
            sunMesh = new THREE.Mesh(sunGeo, sunMat);
            sunMesh.position.set(200, 150, -100);

            moonCanvas.height = 128;

            // 绘制弯月
            moonCtx.clearRect(0, 0, 128, 128);
            // 先画一个完整的月亮
            moonCtx.beginPath();
            moonCtx.arc(64, 64, 50, 0, Math.PI * 2);
            moonCtx.fillStyle = '#fffde7';
            moonCtx.fill();
            // 用深色圆遮挡一部分形成弯月
            moonCtx.beginPath();
            moonCtx.arc(85, 64, 45, 0, Math.PI * 2);
            moonCtx.fillStyle = 'rgba(0,0,0,1)';
            moonCtx.globalCompositeOperation = 'destination-out';
            moonCtx.fill();
            moonCtx.globalCompositeOperation = 'source-over';
            
            // 添加月亮光晕
            const glowCanvas = document.createElement('canvas');
            glowCanvas.width = 128;
            glowCanvas.height = 128;
            const glowCtx = glowCanvas.getContext('2d');

            gradient.addColorStop(0, 'rgba(255, 253, 230, 0.4)');
            gradient.addColorStop(1, 'rgba(255, 253, 230, 0)');
            glowCtx.fillStyle = gradient;
            glowCtx.fillRect(0, 0, 128, 128);
            glowCtx.drawImage(moonCanvas, 0, 0);
            
            const moonTexture = new THREE.CanvasTexture(glowCanvas);
            const moonGeo = new THREE.PlaneGeometry(30, 30);

                map: moonTexture,

                    r * Math.sin(phi) * Math.cos(theta),
                    r * Math.cos(phi) + 50,
